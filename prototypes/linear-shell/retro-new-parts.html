<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 회고 모달 요소 시안</title>
<meta name="description" content="제목 먼저 모달의 제목, 날짜 버튼, 날짜 고르기, 폴더, 하단 버튼을 각각 다섯 가지로 고르고 실제 모달에서 바로 본다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .pg { display: grid; grid-template-columns: 400px minmax(0, 1fr); height: 100vh; }
  .l { overflow: auto; padding: 24px 20px 48px; border-right: 1px solid var(--line); }
  h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .lead { margin: 0 0 20px; font-size: 13px; color: var(--ink3); line-height: 1.6; }
  h2 { margin: 26px 0 10px; font-size: 13px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
  h2 small { font-weight: 400; color: var(--ink4); font-size: 12px; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .op { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; text-align: left; width: 100%; }
  .op:hover { border-color: var(--line2); background: var(--s1); }
  .op:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .op[aria-checked="true"] { border-color: var(--primary); background: var(--primary-a); }
  .op > span { font: 500 12px var(--mono); color: var(--ink4); padding-top: 1px; }
  .op b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 3px; color: var(--ink); }
  .op p { margin: 0; font-size: 12px; color: var(--ink3); line-height: 1.5; }
  .r { display: flex; flex-direction: column; min-width: 0; }
  .cbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink3); flex: none; }
  .cbar code { font-family: var(--mono); color: var(--ink2); }
  .cbar .sp { flex: 1; }
  .cbar button { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line2); font-size: 12px; color: var(--ink2); }
  .cbar button:hover { background: var(--s3); color: var(--ink); }
  iframe { flex: 1; width: 100%; border: 0; background: var(--canvas); }
  @media (max-width: 900px) { body { overflow: auto; } .pg { grid-template-columns: 1fr; height: auto; } .r { height: 80vh; } }
</style>
</head>
<body>
<div class="pg">
  <div class="l">
    <h1>새 회고 모달 요소 시안</h1>
    <p class="lead">"제목 먼저" 모달을 다섯 부분으로 나눠 각각 다섯 가지를 만들었습니다. 고르면 오른쪽 실제 모달에 바로 들어갑니다. 날짜 고르기는 서비스의 할 일 날짜 선택(빠른 날짜 → 월 머리글 → 월요일 시작 칸)을 바탕으로 했습니다. 확정한 조합(제목 4, 날짜 버튼 1, 날짜 고르기 3, 폴더 2, 하단 1)이 기본으로 들어가 있습니다.</p>
    <div id="secs"></div>
  </div>
  <div class="r">
    <div class="cbar">지금 조합 <code id="combo"></code><span class="sp"></span><button type="button" id="reload">다시 열기</button></div>
    <iframe id="live" title="새 회고 모달"></iframe>
  </div>
</div>
<script>
  const SEC = [
    ['mt', '제목', '맨 위 입력', 'date', [
      ['큰 제목', '테두리 없이 큰 글씨. 아래 한 줄 안내.'],
      ['밑줄', '아래 줄 하나. 쓰기 시작하면 줄이 라벤더로.'],
      ['상자', '"제목" 라벨과 일반 입력 상자. 다른 입력과 같은 모양.'],
      ['날짜 제목 넣기', '비어 있으면 오른쪽에 "Tab 날짜 제목 넣기". Tab 한 번으로 "11월 3일 회고"가 들어감.'],
      ['글자 수', '입력 상자 오른쪽에 0 / 60. 제목 길이를 맞추고 싶을 때.'],
    ]],
    ['md', '날짜 버튼', '눌러서 날짜 고르기를 여는 자리', 'date', [
      ['알약', '달력 아이콘 + "오늘, 11월 3일 화요일".'],
      ['큰 숫자', '날짜 숫자를 종류 색으로 크게, 옆에 월 · 요일, "오늘".'],
      ['글자만', '버튼 테두리 없이 "11월 3일 화요일 오늘 ▾".'],
      ['하루씩 넘기기', '알약 양옆 ‹ › 로 전날 · 다음 날. 미래는 막힘.'],
      ['오늘 · 어제 묶음', '"오늘 | 어제 | 다른 날 ▾" 버튼 묶음. 대부분 한 번에 끝.'],
    ]],
    ['mc', '날짜 고르기', '서비스 기본 날짜 선택 바탕', 'date', [
      ['서비스 기본', '빠른 날짜 목록(오늘 · 어제 · 그제), 월 머리글, 월요일 시작 달력. 고른 날은 라벤더.'],
      ['빠른 날짜 버튼', '빠른 날짜를 가로 버튼 세 개로 줄이고 달력을 위로.'],
      ['달력만', '빠른 날짜 없이 달력, 아래에 고른 날짜와 "오늘로".'],
      ['편수 표시', '서비스 기본 + 이미 쓴 날에 회고 편수. 같은 날 여러 편 쓸 때 참고.'],
      ['최근 목록', '최근 10일을 목록으로(오늘, 어제, 요일), 아래 "달력에서 고르기"로 달력 전환.'],
    ]],
    ['mf', '폴더', '어느 폴더에 넣을지', 'folder', [
      ['알약 + 메뉴', '폴더 알약을 누르면 목록.'],
      ['찾기 + 새 폴더', '메뉴 위에 찾기 칸. 없는 이름을 치면 "○○ 폴더 만들기".'],
      ['버튼 묶음', '메뉴 없이 폴더를 한 줄 버튼으로. 폴더가 적을 때.'],
      ['자주 쓰는 폴더', '많이 쓴 폴더 두 개는 버튼, 나머지는 "다른 폴더 ▾".'],
      ['경로', '"회고 / ARCHIVE 개발 ▾" 경로로. 폴더 안 폴더가 있을 때.'],
    ]],
    ['mb', '하단 버튼', '취소 · 만들기', '', [
      ['Enter 안내 + 두 버튼', '"Enter 로 만들기", 취소, 만들고 쓰기.'],
      ['꽉 찬 버튼', '아래를 가득 채운 "만들고 쓰기" 하나, 닫기는 오른쪽 위 X.'],
      ['만들기만', '"만들기만"(목록에 남기) 버튼이 하나 더.'],
      ['계속 만들기', '"계속 만들기"를 켜면 만든 뒤 창이 닫히지 않고 다음 회고를 바로 만듦.'],
      ['버튼 안 단축키', '왼쪽 "Esc 닫기", 버튼 하나에 "만들고 쓰기 Enter".'],
    ]],
  ];
  const sel = { mt: 4, md: 1, mc: 3, mf: 2, mb: 1 };
  let pop = 'date';
  const $ = (q) => document.querySelector(q);
  function draw() {
    $('#secs').innerHTML = SEC.map(([k, n, s, , ops]) => `<h2>${n} <small>${s}</small></h2><div class="opts" role="radiogroup" aria-label="${n}">${ops.map(([t, d], i) =>
      `<button type="button" class="op" role="radio" data-k="${k}" data-v="${i + 1}" aria-checked="${sel[k] === i + 1}"><span>${i + 1}</span><span style="font:inherit;color:inherit;padding:0"><b>${t}</b><p>${d}</p></span></button>`).join('')}</div>`).join('');
    const q = Object.entries(sel).map(([k, v]) => `${k}=${v}`).join('&');
    $('#combo').textContent = SEC.map(([k, n]) => `${n} ${sel[k]}`).join(', ');
    const src = `d-retro2.html?rl=1&vm=grid&ed=0&nd=1&newdlg=1&${q}${pop ? `&ndpop=${pop}` : ''}`;
    if ($('#live').getAttribute('src') !== src) $('#live').setAttribute('src', src);
  }
  document.addEventListener('click', (e) => {
    const o = e.target.closest('.op'); if (o) { sel[o.dataset.k] = +o.dataset.v; pop = SEC.find((s) => s[0] === o.dataset.k)[3]; draw(); return; }
    if (e.target.closest('#reload')) { const f = $('#live'); f.setAttribute('src', f.getAttribute('src')); }
  });
  draw();
</script>
</body>
</html>
