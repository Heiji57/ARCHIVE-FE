<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVE AI 비서</title>
<meta name="description" content="말로 할 일을 만들고 오늘 기록으로 회고 초안을 쓰는 AI 비서 탭. ?ai=g1~g5, c1~c5, k1~k5 로 시안을 바꿔 본다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<link rel="stylesheet" href="shared/planner.css">
<link rel="stylesheet" href="shared/usermenu.css">
<link rel="stylesheet" href="shared/logo.css">
<link rel="stylesheet" href="shared/rest.css">
<link rel="stylesheet" href="shared/ai.css">

</head>
<body>
<div class="app ag" id="app">
  <main class="ag-main" id="am" aria-label="AI 비서"></main>
</div>
<dialog id="detail" aria-label="할 일 상세"></dialog>
<script src="shared/shared.js"></script>
<script src="shared/planner.js"></script>
<script src="shared/logo.js"></script>
<script src="shared/rest.js"></script>
<script src="shared/usermenu.js"></script>
<script>
  const $ = (q, r = document) => r.querySelector(q), A = ARC, P = PL;
  const Q = new URLSearchParams(location.search);
  const IDS = ['g1', 'g2', 'g3', 'g4', 'g5', 'c1', 'c2', 'c3', 'c4', 'c5', 'k1', 'k2', 'k3', 'k4', 'k5'];
  const AI = (() => { const q = Q.get('ai'); try { if (q != null && window.top === window) localStorage.setItem('archive.ai', q); const v = q ?? localStorage.getItem('archive.ai') ?? 'g1'; return IDS.includes(v) ? v : 'g1'; } catch (e) { return IDS.includes(q) ? q : 'g1'; } })();
  /* 시안별 설정: 입력창 모양, 대화 모양, 진행 표시, 옆 칸 */
  const CFG = {
    g1: { cmp: 'pill', talk: 'g', prog: 'think', name: '두 줄 인사' }, g2: { cmp: 'pill', talk: 'g', prog: 'line', name: '부탁 카드' }, g3: { cmp: 'pill', talk: 'g', prog: 'bar', name: '아래 입력 바' },
    g4: { cmp: 'pill', talk: 'g', prog: 'chips', name: '오늘 브리핑' }, g5: { cmp: 'pill', talk: 'g', prog: 'memo', name: '도구 부르기' },
    c1: { cmp: 'round', talk: 'c', prog: 'mini', name: '가운데 질문' }, c2: { cmp: 'round', talk: 'c', prog: 'tool', name: '도구 메뉴' }, c3: { cmp: 'round', talk: 'c', prog: 'chips', name: '맥락 붙이기' },
    c4: { cmp: 'round', talk: 'c', prog: 'log', name: '예약한 일' }, c5: { cmp: 'round', talk: 'c', prog: 'memo', side: 'canvas', name: '캔버스' },
    k1: { cmp: 'card', talk: 'k', prog: 'think', name: '시간대 인사' }, k2: { cmp: 'card', talk: 'k', prog: 'tool', name: '연결된 도구' }, k3: { cmp: 'card', talk: 'k', prog: 'memo', side: 'art', name: '결과물 옆 칸' },
    k4: { cmp: 'card', talk: 'k', prog: 'line', name: '알려 둔 것' }, k5: { cmp: 'card', talk: 'k', prog: 'src', name: '꼼꼼히 찾기' },
  }[AI];
  const STEP = Q.get('demo') ? 900 : 650;
  P.rp = false;
  const I = (p) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
  const ic = {
    send: I('<path d="M12 19V5M6 11l6-6 6 6"/>'), cal: A.ico.cal, todo: I('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/>'), spark: A.ico.sparkle,
    commit: I('<circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/>'), doc: I('<path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h4"/>'), clock: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'), plus: I('<path d="M12 5v14M5 12h14"/>'),
    move: I('<path d="M5 12h14M13 6l6 6-6 6"/>'), mic: I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'), tools: I('<path d="M4 7h10M4 17h6M18 7h2M14 17h6"/><circle cx="16" cy="7" r="2"/><circle cx="12" cy="17" r="2"/>'),
    copy: I('<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>'), redo: I('<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>'), up: I('<path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 3 2l-1 5h6a2 2 0 0 1 2 2l-2 7a2 2 0 0 1-2 1H7"/>'),
    x: A.ico.x, chev: I('<path d="m6 9 6 6 6-6"/>'), book: I('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>'), gh: I('<path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5c0-1 .1-1.5-.5-2 2.8-.3 5.5-1.4 5.5-6a4.7 4.7 0 0 0-1.3-3.2 4.3 4.3 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6.2 0C6.6 2.8 5.6 3.1 5.6 3.1a4.3 4.3 0 0 0-.1 3.2A4.7 4.7 0 0 0 4.2 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>'),
    search: A.ico.search, open: I('<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>'),
  };
  const md2 = (d) => `${+d.slice(5, 7)}/${+d.slice(8)}`;
  const dLabel = (d) => { const x = A.s2d(d); return `${x.getMonth() + 1}월 ${x.getDate()}일 ${A.DOW[x.getDay()]}요일`; };
  const rel = (d) => d === A.TODAY ? '오늘' : d === A.add(A.TODAY, 1) ? '내일' : d === A.add(A.TODAY, 2) ? '모레' : d === A.add(A.TODAY, -1) ? '어제' : '';
  const M = (src) => { const inl = (x) => A.esc(x).replace(/`([^`]+)`/g, '<code>$1</code>'); let h = '', ul = false;
    src.trim().split('\n').map((l) => l.trim()).filter(Boolean).forEach((l) => { const li = l.startsWith('- '); if (ul && !li) { h += '</ul>'; ul = false; }
      if (li) { if (!ul) { h += '<ul>'; ul = true; } const t = l.slice(2); h += `<li${t.startsWith('(') ? ' class="ph"' : ''}>${inl(t)}</li>`; } else if (l.startsWith('## ')) h += `<h2>${inl(l.slice(3))}</h2>`; else h += `<p>${inl(l)}</p>`; });
    return h + (ul ? '</ul>' : ''); };

  /* ---------- 규칙으로 흉내 낸 비서 ---------- */
  const DOWI = { 일: 0, 월: 1, 화: 2, 수: 3, 목: 4, 금: 5, 토: 6 };
  function dateOf(seg, fallback) {
    let m;
    if (/모레/.test(seg)) return A.add(A.TODAY, 2);
    if (/내일/.test(seg)) return A.add(A.TODAY, 1);
    if (/오늘/.test(seg)) return A.TODAY;
    if (/어제/.test(seg)) return A.add(A.TODAY, -1);
    if ((m = seg.match(/(다음\s*주|이번\s*주)?\s*([월화수목금토일])요일/))) { const want = DOWI[m[2]], cur = A.s2d(A.TODAY).getDay();
      if (/다음/.test(m[1] || '')) { const mon = A.add(A.TODAY, -((cur + 6) % 7)); return A.add(mon, 7 + (want + 6) % 7); }
      let diff = (want - cur + 7) % 7; if (diff === 0) diff = 7; return A.add(A.TODAY, diff); }
    if ((m = seg.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))) return `2026-${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}`;
    return fallback;
  }
  function timeOf(seg) {
    const m = seg.match(/(오전|오후|아침|저녁|밤)?\s*(\d{1,2})\s*시(?!간)\s*(반|(\d{1,2})\s*분)?/) || seg.match(/(오전|오후)?\s*(\d{1,2}):(\d{2})/);
    if (!m) return null; let h = +m[2]; const mm = m[3] === '반' ? 30 : +(m[4] || (/^\d+$/.test(m[3] || '') ? m[3] : 0)) || 0;
    if (/오후|저녁|밤/.test(m[1] || '') && h < 12) h += 12; if (!m[1] && h >= 1 && h <= 7) h += 12;
    return h + mm / 60;
  }
  const durOf = (seg) => { const m = seg.match(/(\d+(?:\.\d+)?)\s*시간(\s*반)?/), n = seg.match(/(\d+)\s*분\s*(동안)?/); return m ? +m[1] + (m[2] ? 0.5 : 0) : n && n[2] ? +n[1] / 60 : null; };
  function parseTodos(text) {
    const body = text.replace(/(할\s*일로\s*)?(추가해\s*줘|추가해\s*주세요|만들어\s*줘|만들어\s*주세요|잡아\s*줘|잡아\s*주세요|넣어\s*줘|등록해\s*줘)[.!]?/g, '').trim();
    let last = A.TODAY;
    return body.split(/\s*(?:,|그리고|\n|;)\s*/).map((s) => s.trim()).filter((s) => s.length > 1).map((seg, i) => {
      const date = dateOf(seg, last); last = date; const start = timeOf(seg), d = durOf(seg);
      const title = seg.replace(/(다음\s*주|이번\s*주)?\s*[월화수목금토일]요일(까지|에)?/g, '').replace(/(오늘|내일|모레)(까지|에)?/g, '').replace(/\d{1,2}\s*월\s*\d{1,2}\s*일(까지|에)?/g, '')
        .replace(/(오전|오후|아침|저녁|밤)?\s*\d{1,2}\s*시(?!간)\s*(반|\d{1,2}\s*분)?(에|부터)?/g, '').replace(/(오전|오후)?\s*\d{1,2}:\d{2}(에)?/g, '').replace(/\d+(\.\d+)?\s*시간(\s*반)?(\s*동안)?/g, '').replace(/\d+\s*분\s*동안/g, '')
        .replace(/^\s*(에|에서|까지|부터)\s*/, '').replace(/\s+/g, ' ').trim();
      const end = start != null ? Math.min(24, start + (d || 1)) : null;
      const clash = start != null ? A.onDay(date).find((t) => t.start != null && t.start < end && start < t.end) : null;
      return { id: 'ai' + Date.now() + i, on: true, title: title || '새 할 일', date, start, end, clash: clash ? clash.title : null };
    });
  }
  const dayData = (d) => { const td = A.onDay(d).filter((t) => !t.until || t.until === d); return { done: td.filter((t) => t.status === 'done'), open: td.filter((t) => t.status !== 'done'), commits: A.commits.filter((c) => c.date === d) }; };
  const retroDraft = (d) => { const x = dayData(d);
    return `## ${rel(d) === '오늘' ? '오늘' : '그날'} 한 일\n${x.done.map((t) => `- ${t.title}`).join('\n') || '- (끝낸 일이 없어요)'}\n${x.open.length ? `## 못 끝낸 일\n${x.open.map((t) => `- ${t.title} (${A.ST[t.status]})`).join('\n')}\n` : ''}${x.commits.length ? `## 커밋\n${x.commits.map((c) => `- \`${c.msg}\``).join('\n')}\n` : ''}## 배운 점\n- (한 줄 써 주세요)\n## 내일\n${x.open.map((t) => `- ${t.title} 마무리`).join('\n') || '- '}`; };
  /* 단계: [진행 문장, 아이콘, 자료 이름, 생각 문장, 도구 이름, 도구 결과] */
  function plan(text) {
    if (/회고/.test(text) && /(써|쓰|작성|초안|정리해)/.test(text) && !/추가|잡아|넣어|일정/.test(text)) { const d = dateOf(text, A.TODAY), x = dayData(d), r = rel(d) || md2(d);
      return { kind: 'retro', date: d, title: `${+d.slice(5, 7)}월 ${+d.slice(8)}일 회고`, html: M(retroDraft(d)),
        say: `${rel(d) || dLabel(d)} 기록으로 <b>회고 초안</b>을 써 두었어요<span class="ax-ref">1</span><span class="ax-ref">2</span>. 배운 점은 직접 적어 주세요. 저장할까요?`,
        steps: [[`${r} 할 일 ${x.done.length + x.open.length}개 살펴보는 중`, ic.todo, `${r} 할 일 ${x.done.length + x.open.length}개`, `${r} 끝낸 일 ${x.done.length}개와 못 끝낸 일 ${x.open.length}개를 나눠 볼게요.`, '할 일 읽기', `${x.done.length + x.open.length}개를 찾았어요`],
          [`커밋 ${x.commits.length}개 읽는 중`, ic.commit, `커밋 ${x.commits.length}개`, `커밋 메시지에서 그날 고친 것을 뽑아 둘게요.`, 'GitHub 커밋 읽기', `${x.commits.length}개를 읽었어요`],
          ['초안 쓰는 중', ic.doc, '회고 형식', '한 일, 못 끝낸 일, 커밋, 배운 점, 내일 순서로 쓰고 배운 점은 비워 둘게요.', '회고 초안 쓰기', '소제목 5개로 썼어요']] }; }
    if (/옮겨|미뤄|넘겨/.test(text)) { const open = dayData(A.TODAY).open;
      return { kind: 'move', items: open.map((t) => ({ id: t.id, on: true, title: t.title, date: A.add(A.TODAY, 1), start: t.start, end: t.end })), say: `오늘 못 끝낸 <b>${open.length}개</b>를 내일 같은 시간으로 옮길게요<span class="ax-ref">1</span>. 이대로 옮길까요?`,
        steps: [['오늘 남은 일 찾는 중', ic.todo, `오늘 남은 일 ${open.length}개`, `오늘 아직 끝나지 않은 일을 모을게요.`, '할 일 읽기', `${open.length}개가 남았어요`], ['내일 일정 확인하는 중', ic.cal, `${md2(A.add(A.TODAY, 1))} 캘린더`, '내일 같은 시간이 비어 있는지 볼게요.', '캘린더 읽기', '겹치는 일정이 없어요']] }; }
    if (/할\s*일|추가|만들|잡아|일정|넣어|등록|회의|리뷰|정리|미팅/.test(text)) { const items = parseTodos(text), cl = items.filter((x) => x.clash).length, days = [...new Set(items.map((x) => x.date))];
      return { kind: 'todos', items, say: `할 일 <b>${items.length}개</b>로 정리했어요<span class="ax-ref">1</span>.${cl ? ` ${cl}개는 이미 있는 일정과 시간이 겹쳐요<span class="ax-ref">2</span>.` : ''} 이대로 추가할까요?`,
        steps: [['부탁 읽는 중', ic.doc, '부탁 내용', `할 일 ${items.length}개로 나눌 수 있겠어요.`, '부탁 나누기', `${items.length}개로 나눴어요`],
          ['날짜와 시간 맞추는 중', ic.clock, days.map((d) => rel(d) || md2(d)).join(', '), `${days.map((d) => rel(d) || dLabel(d)).join(', ')}에 시간을 맞춰 볼게요. 길이를 말하지 않은 일은 1시간으로 잡을게요.`, '날짜 · 시간 읽기', `${items.filter((x) => x.start != null).length}개에 시간을 붙였어요`],
          ['겹치는 일정 찾는 중', ic.cal, `${days.length}일치 캘린더`, `이미 잡힌 일정과 겹치는지 확인할게요.`, '캘린더 읽기', cl ? `${cl}개가 겹쳐요` : '겹치는 일정이 없어요']] }; }
    return { kind: 'text', say: '할 일을 만들거나 옮기고, 회고 초안을 쓸 수 있어요. 예를 들어 "내일 오후 3시에 디자인 리뷰 1시간 추가해줘"라고 해 주세요.', steps: [['부탁 읽는 중', ic.doc, '부탁 내용', '어떤 일을 원하시는지 볼게요.', '부탁 읽기', '할 수 있는 일을 안내할게요']] };
  }

  const SEED = '내일 오전 10시에 스프린트 회의, 오후 2시에 디자인 리뷰 1시간, 금요일에 릴리스 노트 정리 추가해줘';
  const S = { msgs: [], busy: false, input: '', pop: null, mode: 'quick', deep: true, scope: '1주', ctx: ['today', 'commits', 'retro'], tools: { cal: true, todo: true, retro: true, gh: true }, sched: [true, false], memo: '회고는 한 일, 배운 점, 내일 순서로 짧게 써 줘.\n회의는 길이를 말하지 않으면 1시간으로 잡아 줘.', pane: null };

  function send(text) {
    text = (text || '').trim(); if (!text || S.busy) return;
    const r = plan(text), m = { role: 'ai', q: text, r, step: 0, done: false, t0: Date.now(), ts: [] };
    S.msgs.push({ role: 'you', text }, m); S.busy = true; S.input = ''; S.pop = null; S.pane = S.msgs.length - 1; render(); end();
    const tick = () => { m.ts[m.step] = Date.now() - m.t0; if (m.step < r.steps.length) { m.step++; render(); end(); setTimeout(tick, STEP); } else { m.done = true; S.busy = false; render(); end(); const c = $('#cmp'); c && c.focus(); } };
    setTimeout(tick, 200);
  }
  const end = () => { const t = $('.ax-th'); if (t) t.scrollTop = t.scrollHeight; };
  function apply(i) {
    const r = S.msgs[i].r; if (r.applied) return;
    if (r.kind === 'todos') { const add = r.items.filter((x) => x.on).map((x) => ({ id: x.id, title: x.title, status: 'todo', date: x.date, start: x.start, end: x.end, tag: 'work', tags: ['work'], note: 'AI 비서가 만든 할 일', ai: true }));
      add.forEach((t) => A.todos.push(t)); try { sessionStorage.setItem('archive.aiTodos', JSON.stringify([...JSON.parse(sessionStorage.getItem('archive.aiTodos') || '[]'), ...add])); } catch (e) {}
      r.applied = add.map((t) => t.id); }
    if (r.kind === 'move') { r.prev = []; r.items.filter((x) => x.on).forEach((x) => { const t = A.byId(x.id); if (t) { r.prev.push([t.id, t.date]); t.date = x.date; } }); r.applied = r.prev.map((p) => p[0]); }
    if (r.kind === 'retro') { const doc = $(`[data-doc="${i}"]`); if (doc) r.html = doc.innerHTML; r.rid = 'air' + Date.now();
      try { const s = JSON.parse(sessionStorage.getItem('archive.aiRetros') || '[]'); s.push({ id: r.rid, date: r.date, title: '', html: r.html }); sessionStorage.setItem('archive.aiRetros', JSON.stringify(s)); } catch (e) {}
      r.applied = [r.rid]; }
    render();
  }
  function undo(i) { const r = S.msgs[i].r; if (!r.applied) return;
    if (r.kind === 'todos') { A.todos = A.todos.filter((t) => !r.applied.includes(t.id)); try { sessionStorage.setItem('archive.aiTodos', JSON.stringify(JSON.parse(sessionStorage.getItem('archive.aiTodos') || '[]').filter((t) => !r.applied.includes(t.id)))); } catch (e) {} }
    if (r.kind === 'move') r.prev.forEach(([id, d]) => { const t = A.byId(id); if (t) t.date = d; });
    if (r.kind === 'retro') { try { sessionStorage.setItem('archive.aiRetros', JSON.stringify(JSON.parse(sessionStorage.getItem('archive.aiRetros') || '[]').filter((x) => x.id !== r.rid))); } catch (e) {} }
    r.applied = null; render(); }

  /* ---------- 결과 ---------- */
  const wh = (x) => `${rel(x.date) || md2(x.date)} ${A.DOW[A.s2d(x.date).getDay()]}요일${x.start != null ? `, ${A.hmd(x.start)}${x.end ? `부터 ${A.hmd(x.end)}까지` : ''}` : ', 종일'}`;
  function itemsHTML(m, i, fill = Infinity) {
    const r = m.r;
    return `<ul class="ag-items">${r.items.map((x, j) => j >= fill ? `<li class="ag-it sk" aria-hidden="true"><input type="checkbox" disabled><span class="ti"></span><span class="wh"></span></li>`
      : `<li class="ag-it ${x.on ? '' : 'off'} ${!m.done && j === fill - 1 ? 'fresh' : ''}"><input type="checkbox" ${x.on ? 'checked' : ''} ${r.applied || !m.done ? 'disabled' : ''} data-on="${i}:${j}" aria-label="${A.esc(x.title)} 넣기">
        <input class="ti" value="${A.esc(x.title)}" data-ti="${i}:${j}" ${r.applied || r.kind === 'move' || !m.done ? 'readonly' : ''} aria-label="할 일 제목">${r.applied && x.on ? `<span class="got">${r.kind === 'move' ? '옮겼어요' : '추가했어요'}</span>` : `<span class="wh">${wh(x)}</span>`}
        ${x.clash && !r.applied && m.done ? `<span class="clash">이미 있는 "${A.esc(x.clash)}"와 시간이 겹쳐요</span>` : ''}</li>`).join('')}</ul>`;
  }
  function resHTML(m, i) {
    const r = m.r; if (r.kind === 'text') return '';
    const n = r.kind === 'retro' ? 1 : r.items.filter((x) => x.on).length;
    const head = r.kind === 'retro' ? `<div class="ag-res-h"><b>${r.title}</b><span>${dLabel(r.date)}</span></div>` : `<div class="ag-res-h"><b>${r.kind === 'move' ? '내일로 옮길 일' : '새 할 일'}</b><span>${r.items.length}개</span></div>`;
    const body = r.kind === 'retro' ? `<div class="ag-doc" contenteditable="${r.applied ? 'false' : 'true'}" data-doc="${i}" role="textbox" aria-multiline="true" aria-label="회고 초안">${r.html}</div>` : itemsHTML(m, i);
    const act = r.applied
      ? `<div class="ag-act"><span class="msg">${r.kind === 'retro' ? `회고로 저장했어요. <a href="d-retro2.html?entry=${r.rid}">회고에서 열기</a>` : r.kind === 'move' ? `${r.applied.length}개를 옮겼어요. <a href="d-calendar.html">캘린더에서 보기</a>` : `${r.applied.length}개를 추가했어요. <a href="d-calendar.html">캘린더에서 보기</a>`}</span><span class="sp"></span><button type="button" class="ag-btn q" data-undo="${i}">되돌리기</button></div>`
      : `<div class="ag-act"><span class="sp"></span><button type="button" class="ag-btn q" data-redo="${i}">다시 정리</button><button type="button" class="ag-btn p" data-apply="${i}" ${n ? '' : 'disabled'}>${r.kind === 'retro' ? '회고로 저장' : r.kind === 'move' ? `${n}개 옮기기` : `${n}개 추가`}</button></div>`;
    return `<div class="ag-res">${head}${body}${act}</div>`;
  }

  /* ---------- 진행 표시 ---------- */
  const secs = (ms) => `${(ms / 1000).toFixed(1)}초`;
  function progress(m) {
    const st = m.r.steps, k = Math.min(m.step, st.length) - 1, total = m.ts[st.length] || (Date.now() - m.t0), p = CFG.prog;
    if (p === 'think') return `<div class="px-think" aria-live="polite">${m.done ? `<details><summary>생각한 과정 보기, ${secs(total)}</summary>${st.map((s) => `<p>${s[3]}</p>`).join('')}</details>`
      : st.map((s, j) => j > k ? '' : `<p class="${j === k ? 'on' : ''}">${s[3]}</p>`).join('') || '<p class="on">부탁을 읽고 있어요.</p>'}</div>`;
    if (p === 'mini') return `<div class="px-mini" aria-live="polite">${m.done ? `<details><summary>${secs(total)} 동안 생각함</summary><ul>${st.map((s) => `<li>${s[2]} 확인</li>`).join('')}</ul></details>` : `<span class="on">${k >= 0 ? st[k][0] : '생각하는 중'}</span>`}</div>`;
    if (p === 'tool') return `<div class="px-tool" aria-live="polite">${st.map((s, j) => j > k && !m.done ? '' : `<details class="${!m.done && j === k ? 'on' : ''}"><summary>${s[1]}<span class="ax-nm">${s[4]}</span><span class="st">${!m.done && j === k ? '하는 중' : s[5]}</span></summary><div class="out">${s[3]}</div></details>`).join('')}</div>`;
    if (p === 'src') return `<div class="px-src" aria-live="polite"><span class="hd">${m.done ? `자료 ${st.length}가지를 찾아 정리했어요` : '찾아보는 중'}</span><ol>${st.map((s, j) => j > k && !m.done ? '' : `<li class="${!m.done && j === k ? 'on' : ''}"><span class="ax-ref">${j + 1}</span>${s[2]}<small>${!m.done && j === k ? '읽는 중' : '읽음'}</small></li>`).join('')}</ol></div>`;
    if (p === 'line') return `<div class="pg1" aria-live="polite">${m.done ? `<details><summary>${secs(total)} 동안 정리했어요</summary><ol>${st.map((s, j) => `<li>${s[2]} 확인<span>${secs((m.ts[j + 1] || 0) - (m.ts[j] || 0))}</span></li>`).join('')}</ol></details>`
      : `<div class="pg1-line"><span class="pg1-now">${k >= 0 ? st[k][0] : '부탁 받는 중'}</span><span class="t">${Math.max(1, k + 1)} / ${st.length}</span></div>`}</div>`;
    if (p === 'bar') return `<div class="pg2 ${m.done ? 'done' : ''}" aria-live="polite"><div class="pg2-bar" style="--n:${st.length}" role="progressbar" aria-label="진행" aria-valuemin="0" aria-valuemax="${st.length}" aria-valuenow="${m.done ? st.length : Math.max(0, k)}">${st.map((_, j) => `<i style="--f:${m.done || j < k ? 1 : j === k ? 0.55 : 0}"></i>`).join('')}</div>
      <div class="pg2-l"><b>${m.done ? '다 됐어요' : k >= 0 ? st[k][0] : '시작하는 중'}</b><span>${m.done ? secs(total) : `${Math.max(1, k + 1)} / ${st.length}`}</span></div></div>`;
    if (p === 'log') return `<ol class="pg3 ${m.done ? 'done' : ''}" aria-live="polite">${st.map((s, j) => j > k && !m.done ? '' : `<li class="${!m.done && j === k ? 'on' : 'past'}"><span class="t">${secs(m.ts[j] || 0)}</span><span class="x">${!m.done && j === k ? s[0] : `${s[2]} 확인`}</span></li>`).join('')}${m.done ? `<li class="past"><span class="t">${secs(total)}</span><span class="x">정리 끝</span></li>` : ''}</ol>`;
    if (p === 'chips') return `<div class="pg5 ${m.done ? 'done' : ''}" aria-live="polite"><span class="pg5-h">${m.done ? `자료 ${st.length}가지를 보고 정리했어요` : '이걸 보고 있어요'}</span><div class="pg5-l">${st.map((s, j) => j > k && !m.done ? '' : `<span class="${!m.done && j === k ? 'on' : ''}">${s[1]}${s[2]}</span>`).join('')}</div></div>`;
    return '';
  }
  function memo(m, i) {
    const r = m.r, st = r.steps, k = Math.max(0, Math.min(m.step, st.length)), frac = m.done ? 1 : k / (st.length + 1);
    if (r.kind === 'text') return m.done ? '' : `<p class="pg4-h" aria-live="polite">${st[0][0]}</p>`;
    if (m.done) return resHTML(m, i);
    if (r.kind === 'retro') { const parts = r.html.split(/(?=<h2>)/), show = Math.floor(parts.length * frac);
      return `<div class="ag-res"><div class="ag-res-h"><b>${r.title}</b><span class="pg4-h" aria-live="polite">${st[Math.max(0, k - 1)][0]}</span></div><div class="ag-doc">${parts.slice(0, show).join('')}${'<span class="sk"></span>'.repeat(Math.max(2, (parts.length - show) * 2))}</div></div>`; }
    return `<div class="ag-res"><div class="ag-res-h"><b>${r.kind === 'move' ? '내일로 옮길 일' : '새 할 일'}</b><span class="pg4-h" aria-live="polite">${st[Math.max(0, k - 1)][0]}</span></div>${itemsHTML(m, i, Math.floor(r.items.length * frac))}</div>`;
  }
  const acts = (i) => `<div class="ax-acts" aria-label="답 도구"><button type="button" class="ax-ib" data-toast="답을 복사했어요" aria-label="복사">${ic.copy}</button><button type="button" class="ax-ib" data-redo="${i}" aria-label="다시 정리">${ic.redo}</button><button type="button" class="ax-ib" data-toast="좋은 답이라고 기록했어요" aria-label="좋아요">${ic.up}</button></div>`;
  function turn(m, i) {
    const side = CFG.side && m.r.kind !== 'text';
    const res = side ? (m.done || CFG.prog === 'memo' ? `<button type="button" class="ax-open" data-pane="${i}">${m.r.kind === 'retro' ? ic.doc : ic.todo}<span><b>${m.r.kind === 'retro' ? m.r.title : m.r.kind === 'move' ? '내일로 옮길 일' : `새 할 일 ${m.r.items.length}개`}</b>${CFG.side === 'canvas' ? '캔버스에서 고치기' : '옆 칸에서 보기'}</span></button>` : '')
      : CFG.prog === 'memo' ? memo(m, i) : m.done ? resHTML(m, i) : '';
    const say = m.done ? `<p class="ag-say">${CFG.prog === 'src' ? m.r.say : m.r.say.replace(/<span class="ax-ref">\d+<\/span>/g, '')}</p>` : '';
    const prog = CFG.prog === 'memo' ? '' : progress(m);
    const body = `${prog}${say}${res}${m.done && CFG.talk !== 'g' ? acts(i) : ''}`;
    if (CFG.talk === 'g') return `<div class="ax-a"><span class="ax-mark">${ic.spark}</span><div class="bd">${body}</div></div>`;
    return `<div class="ax-a"><div class="bd">${body}</div></div>`;
  }
  const you = (m) => CFG.talk === 'k' ? `<div class="ax-u k"><span class="ax-av">D</span><span>${A.esc(m.text)}</span></div>` : `<div class="ax-u">${A.esc(m.text)}</div>`;

  /* ---------- 입력창 ---------- */
  function composer(ph, o = {}) {
    const ta = `<textarea id="cmp" rows="1" placeholder="${ph}" aria-label="AI 비서에게 부탁하기">${A.esc(S.input)}</textarea>`;

    if (CFG.cmp === 'pill') return `<div class="ax-cmp pill">${ta}<div class="ax-cbar"><button type="button" class="ax-ib" data-toast="파일 첨부는 시안에서 생략했어요" aria-label="첨부">${ic.plus}</button>
        ${o.tools ? o.tools : `<button type="button" class="ax-tool" data-fill="할 일: ">${ic.todo}할 일</button><button type="button" class="ax-tool" data-fill="오늘 회고 써줘">${ic.doc}회고</button>`}
        <span class="sp"></span>${o.mode ? `<span class="q-wrap">${o.mode}</span>` : ''}<button type="button" class="ax-ib" data-toast="음성 입력은 시안에서 생략했어요" aria-label="말로 부탁하기">${ic.mic}</button>${go}</div></div>`;
    if (CFG.cmp === 'round') return `${o.ctx || ''}<div class="ax-cmp round">${ta}<div class="ax-cbar"><button type="button" class="ax-ib" data-toast="파일 첨부는 시안에서 생략했어요" aria-label="첨부">${ic.plus}</button>
        <button type="button" class="ax-tool" data-pop="tools" aria-expanded="${S.pop === 'tools'}">${ic.tools}도구</button><span class="sp"></span><button type="button" class="ax-ib" data-toast="음성 입력은 시안에서 생략했어요" aria-label="말로 부탁하기">${ic.mic}</button>${go}</div>
        ${S.pop === 'tools' ? `<div class="ax-menu" role="menu">${[['할 일 만들기', '날짜와 시간을 읽어 할 일로', ic.todo, '내일 오전 10시에 '], ['회고 쓰기', '그날 할 일과 커밋으로 초안', ic.doc, '오늘 회고 써줘'], ['일정 옮기기', '남은 일을 다른 날로', ic.move, '오늘 못 끝낸 일 내일로 옮겨줘'], ['캘린더 정리', '겹치는 일정 찾기', ic.cal, '내일 겹치는 일정 정리해줘']].map(([t, d, ii, q]) => `<button type="button" role="menuitem" data-fill="${q}">${ii}<span>${t}</span><small>${d}</small></button>`).join('')}</div>` : ''}</div>`;
    return `<div class="ax-cmp card">${ta}<div class="ax-cbar"><button type="button" class="ax-ib" data-toast="파일 첨부는 시안에서 생략했어요" aria-label="첨부">${ic.plus}</button>${o.tools || `<button type="button" class="ax-tool" data-pop="tools2" aria-expanded="${S.pop === 'tools2'}">${ic.tools}도구 4개</button>`}<span class="sp"></span>
        <button type="button" class="ax-sel" data-cycle="style">${S.mode === 'quick' ? '짧게' : '자세히'}${ic.chev}</button>${go}</div></div>`;
  }

  /* ---------- 시작 화면 15가지 ---------- */
  const x0 = dayData(A.TODAY), tmr = A.onDay(A.add(A.TODAY, 1));
  const nowWord = A.NOW < 12 ? '좋은 아침이에요' : A.NOW < 18 ? '좋은 오후예요' : '좋은 저녁이에요';
  const todayList = () => A.onDay(A.TODAY).filter((t) => !t.until).sort((a, b) => (a.start ?? 99) - (b.start ?? 99));
  const LAND = {
    g1: () => `<div class="ax-center"><div class="ax-wrap"><h1 class="ax-h lg"><span class="ax-nm">developer님, 안녕하세요</span><br>무엇을 정리해 드릴까요?</h1>${composer('비서에게 부탁하기')}</div></div>`,
    g2: () => `<div class="ax-center"><div class="ax-wrap ax-wide"><h1 class="ax-h"><span class="ax-nm">developer님</span>, 오늘 무엇을 도와드릴까요?</h1>${composer('비서에게 부탁하기')}
      <div class="ax-cards">${[['내일 오전 회의 두 개 잡기', '내일 오전 10시에 스프린트 회의, 11시에 디자인 리뷰 추가해줘', ic.cal], ['오늘 회고 초안 쓰기', '오늘 회고 써줘', ic.doc], ['못 끝낸 일 내일로 옮기기', '오늘 못 끝낸 일 내일로 옮겨줘', ic.move], ['금요일까지 할 일 정리', '금요일에 릴리스 노트 정리 추가해줘', ic.todo]].map(([t, q, ii]) => `<button type="button" class="ax-card" data-ask="${A.esc(q)}">${t}${ii}</button>`).join('')}</div></div></div>`,
    g3: () => `<div class="ax-top"><div class="ax-wrap"><h1 class="ax-h lg"><span class="ax-nm">안녕하세요</span><br>오늘은 할 일 ${x0.done.length + x0.open.length}개 중 ${x0.done.length}개를 끝냈어요</h1>
      <div class="ax-pills">${['남은 일 내일로 옮겨줘', '오늘 회고 써줘', '내일 오후 3시에 디자인 리뷰 잡아줘'].map((q) => `<button type="button" class="ax-pill" data-ask="${A.esc(q)}">${A.esc(q)}</button>`).join('')}</div></div></div><div class="ax-dock">${composer('비서에게 부탁하기')}</div>`,

      ${composer('이 일정으로 무엇을 할까요?')}<div class="ax-pills"><button type="button" class="ax-pill" data-ask="오늘 못 끝낸 일 내일로 옮겨줘">${ic.move}남은 ${x0.open.length}개 옮기기</button><button type="button" class="ax-pill" data-ask="오늘 회고 써줘">${ic.doc}오늘 회고 쓰기</button></div></div></div>`,
    g5: () => `<div class="ax-center"><div class="ax-wrap"><h1 class="ax-h"><span class="ax-nm">developer님</span>, 무엇을 정리해 드릴까요?</h1>
      ${composer('@ 로 도구를 부르거나 그냥 부탁하세요', { tools: ['캘린더', '할 일', '회고', 'GitHub'].map((n) => `<button type="button" class="ax-tool" data-fill="@${n} ">@${n}</button>`).join(''),
        mode: `<button type="button" class="ax-sel" data-cycle="mode">${S.mode === 'quick' ? '빠르게' : '꼼꼼하게'}${ic.chev}</button>` })}
      <p class="ax-hint">"@캘린더 내일 비는 시간 알려줘"처럼 도구를 직접 부를 수 있어요.</p></div></div>`,
    c1: () => `<div class="ax-center"><div class="ax-wrap"><h1 class="ax-h c">무엇을 도와드릴까요?</h1>${composer('무엇이든 부탁하세요')}
      <div class="ax-pills c">${[[ic.todo, '할 일 만들기', '내일 오전 10시에 스프린트 회의 잡아줘'], [ic.doc, '회고 쓰기', '오늘 회고 써줘'], [ic.move, '일정 옮기기', '오늘 못 끝낸 일 내일로 옮겨줘'], [ic.cal, '오늘 요약', '오늘 회고 써줘']].map(([ii, t, q]) => `<button type="button" class="ax-pill" data-ask="${A.esc(q)}">${ii}${t}</button>`).join('')}</div></div></div>`,
    c2: () => { if (S.pop == null && !S.msgs.length && !S.popInit) { S.pop = 'tools'; S.popInit = true; } return `<div class="ax-center"><div class="ax-wrap"><h1 class="ax-h c">무엇을 도와드릴까요?</h1>${composer('부탁하거나 도구를 고르세요')}<p class="ax-hint c">도구를 고르면 부탁이 미리 채워져요.</p></div></div>`; },
    c3: () => { const ctx = { today: [ic.todo, `오늘 할 일 ${x0.done.length + x0.open.length}개`], commits: [ic.commit, `오늘 커밋 ${x0.commits.length}개`], retro: [ic.doc, '어제 회고'] };
      return `<div class="ax-center"><div class="ax-wrap"><h1 class="ax-h c">무엇을 도와드릴까요?</h1>${composer('붙여 둔 자료를 보고 답해요', { ctx: `<div class="ax-ctx" aria-label="붙여 둔 자료">${S.ctx.map((k) => `<span>${ctx[k][0]}${ctx[k][1]}<button type="button" data-unctx="${k}" aria-label="${ctx[k][1]} 빼기">${ic.x}</button></span>`).join('')}${S.ctx.length < 3 ? `<span><button type="button" data-ctxall aria-label="자료 다시 붙이기" style="width:auto;padding:0 6px">${ic.plus}</button></span>` : ''}</div>` })}

    /* 8 색 머리 카드: 네 장, 왼쪽 위에 색 아이콘과 한 줄 설명 */
    8: () => `<div class="as as8"><div class="as-in">${hi2('developer')}${composer('비서에게 부탁하기')}
      <div class="as8-g">${[['todo', ic.todo, '할 일 만들기', '날짜와 시간을 말하면 할 일로', 'fill', '내일 오전 10시에 '], ['retro', ic.doc, '오늘 회고 쓰기', `끝낸 일 ${x0.done.length}개, 커밋 ${x0.commits.length}개로 초안`, 'ask', '오늘 회고 써줘'], ['move', ic.move, '남은 일 옮기기', `못 끝낸 ${x0.open.length}개를 내일 같은 시간으로`, 'ask', '오늘 못 끝낸 일 내일로 옮겨줘'], ['cal', ic.cal, '내일 일정 보기', `내일은 지금 ${tmrL.length}개`, 'fill', '내일 오후 3시에 ']].map(([k, ii, t, d, a, q]) => `<button type="button" class="as8-c k-${k}" data-${a}="${A.esc(q)}"><span class="as-ic">${ii}</span><b>${t}</b><small>${d}</small></button>`).join('')}</div></div></div>`,
    /* 9 오늘 색 띠: 입력창 아래에 오늘 일정을 캘린더 색으로 */
    9: () => { const L = todayList().filter((t) => t.start != null), H0 = 8, H1 = 20, pc = (h) => `${((Math.min(Math.max(h, H0), H1) - H0) / (H1 - H0)) * 100}%`;
      return `<div class="as as9"><div class="as-in">${hi2('developer')}${composer('오늘 일정을 보고 정리해요')}
        <div class="as9-day"><p><b>오늘</b><span>할 일 ${x0.done.length + x0.open.length}개 중 ${x0.done.length}개 끝냄, 커밋 ${x0.commits.length}개</span></p>
        <div class="as9-bar" role="img" aria-label="오늘 일정 막대">${L.map((t) => `<i class="${t.status}" style="left:${pc(t.start)};width:calc(${pc(t.end ?? t.start + 1)} - ${pc(t.start)});--cc:${P.calC ? P.calC(t) : 'var(--primary-h)'}" title="${A.esc(t.title)}"></i>`).join('')}<span class="nw" style="left:${pc(A.NOW)}"></span></div>
        <p class="as9-ax"><span>오전 8시</span><span>낮 2시</span><span>저녁 8시</span></p></div>
        <div class="as6-l">${SUG.slice(0, 3).map(([k, ii, t, a, q]) => `<button type="button" class="as-chip k-${k}" data-${a}="${A.esc(q)}"><span class="as-ic">${ii}</span>${t}</button>`).join('')}</div></div></div>`; },
    /* 10 인사에 색: 이름만 앱 색으로, 아래 칩은 숫자 붙은 칩 */
    10: () => `<div class="as as10"><div class="as-in"><h1 class="as-h2"><span class="as10-nm">developer님</span>, 오늘 <span class="as10-n k-todo">${x0.open.length}개</span>가 남았고<br><span class="as10-n k-retro">회고</span>는 아직이에요</h1>${composer('무엇이든 부탁하세요')}
      <div class="as6-l">${[['move', ic.move, `남은 ${x0.open.length}개 옮기기`, 'ask', '오늘 못 끝낸 일 내일로 옮겨줘'], ['retro', ic.doc, '회고 초안 쓰기', 'ask', '오늘 회고 써줘'], ['todo', ic.todo, '할 일 만들기', 'fill', '내일 오전 10시에 '], ['git', ic.commit, `커밋 ${x0.commits.length}개 정리`, 'ask', '오늘 회고 써줘']].map(([k, ii, t, a, q]) => `<button type="button" class="as-chip k-${k}" data-${a}="${A.esc(q)}"><span class="as-ic">${ii}</span>${t}</button>`).join('')}</div></div></div>`,
  });
  if (ASV[AS]) LAND[AI] = ASV[AS];

  /* ---------- 진행과 결과 ---------- */
  const stInfo = (m) => { const st = m.r.steps, k = m.done ? st.length : Math.max(0, Math.min(m.step, st.length) - 1); return { st, k, n: st.length }; };
  const state = (m) => (!m.done ? ['run', '진행 중'] : m.r.kind === 'text' ? ['info', '안내'] : m.r.applied ? ['ok', '적용함'] : ['wait', '확인 기다림']);
  const sayTxt = (m) => m.r.say.replace(/<span class="ax-ref">\d+<\/span>/g, '');
  const tgl = (i, j, x, r, m) => `<button type="button" class="ap-tg" data-aon="${i}:${j}" aria-pressed="${x.on}" ${r.applied || !m.done ? 'disabled' : ''} aria-label="${A.esc(x.title)} ${x.on ? '빼기' : '넣기'}">${x.on ? '넣음' : '뺌'}</button>`;
  const tiIn = (i, j, x, r) => `<input class="ap-ti" value="${A.esc(x.title)}" data-ti="${i}:${j}" ${r.applied || r.kind === 'move' ? 'readonly' : ''} aria-label="할 일 제목">`;
  const whenD = (x) => `${rel(x.date) || md2(x.date)} ${A.DOW[A.s2d(x.date).getDay()]}`, whenT = (x) => (x.start != null ? `${A.hmd(x.start)}${x.end ? ` ~ ${A.hmd(x.end)}` : ''}` : '종일');
  const actsV = (m, i) => { const r = m.r; if (!m.done || r.kind === 'text') return ''; const n = r.kind === 'retro' ? 1 : r.items.filter((x) => x.on).length;
    if (r.applied) return `<div class="ap-act"><span class="ap-msg">${r.kind === 'retro' ? `회고로 저장했어요. <a href="d-retro2.html?entry=${r.rid}">회고에서 열기</a>` : `${r.applied.length}개를 ${r.kind === 'move' ? '옮겼어요' : '추가했어요'}. <a href="d-calendar.html">캘린더에서 보기</a>`}</span><button type="button" class="ap-b" data-undo="${i}">되돌리기</button></div>`;
    return `<div class="ap-act"><span class="ap-msg">${r.kind === 'retro' ? '초안은 바로 고칠 수 있어요' : '눌러서 넣고 뺄 수 있어요'}</span><button type="button" class="ap-b" data-redo="${i}">다시 정리</button><button type="button" class="ap-b p" data-apply="${i}" ${n ? '' : 'disabled'}>${r.kind === 'retro' ? '회고로 저장' : r.kind === 'move' ? `${n}개 옮기기` : `${n}개 추가`}</button></div>`; };
  const docV = (m, i) => `<div class="ag-doc ap-doc" contenteditable="${m.r.applied ? 'false' : 'true'}" data-doc="${i}" role="textbox" aria-multiline="true" aria-label="회고 초안">${m.r.html}</div>`;
  const tableV = (m, i) => { const r = m.r; return `<table class="ap-tb"><thead><tr><th scope="col">${r.kind === 'move' ? '옮길 일' : '할 일'}</th><th scope="col">날짜</th><th scope="col">시간</th><th scope="col"><span class="sr">넣기</span></th></tr></thead><tbody>${r.items.map((x, j) => `<tr class="${x.on ? '' : 'off'}"><td>${tiIn(i, j, x, r)}${x.clash && !r.applied ? `<small class="ap-clash">"${A.esc(x.clash)}"와 겹쳐요</small>` : ''}</td><td>${whenD(x)}</td><td>${whenT(x)}</td><td>${tgl(i, j, x, r, m)}</td></tr>`).join('')}</tbody></table>`; };
  const resV = (m, i) => (m.r.kind === 'text' ? '' : m.r.kind === 'retro' ? docV(m, i) : tableV(m, i));
  const skel = (n = 3) => `<div class="ap-sk" aria-hidden="true">${'<i></i>'.repeat(n)}</div>`;
  /* 2: 그날 캘린더에 들어갈 자리 */
  /* 2: 그날 캘린더에 들어갈 자리. 새 일정 주변 시간만 크게 보여 줌 */
  const calV = (m, i) => { const r = m.r; if (r.kind === 'retro' || r.kind === 'text') return m.done ? resV(m, i) : skel(4);
    const show = m.done ? r.items : r.items.slice(0, Math.floor(r.items.length * (m.step / (r.steps.length + 1))));
    const days = [...new Set(r.items.map((x) => x.date))].slice(0, 3), tim = r.items.filter((x) => x.start != null);
    let lo = tim.length ? Math.floor(Math.min(...tim.map((x) => x.start))) - 1 : 9, hi = tim.length ? Math.ceil(Math.max(...tim.map((x) => x.end ?? x.start + 1))) + 1 : 15;
    lo = Math.max(8, lo); hi = Math.min(21, Math.max(hi, lo + 5)); const PX = 44, y = (h) => (Math.min(Math.max(h, lo), hi) - lo) * PX, hgt = (a, b) => Math.max(y(b) - y(a) - 2, 18);
    const hrs = []; for (let h = lo; h < hi; h++) hrs.push(h);
    const moved = new Set(r.kind === 'move' ? r.items.map((x) => x.id) : []);
    return `<div class="ap2-cal" style="--n:${days.length}">${days.map((d) => { const mine = show.filter((x) => x.date === d), ev = A.onDay(d).filter((t) => t.start != null && !t.until && !moved.has(t.id) && (t.end ?? t.start + 1) > lo && t.start < hi), allday = mine.filter((x) => x.start == null);
      const over = (x) => ev.some((t) => t.start < (x.end ?? x.start + 1) && x.start < (t.end ?? t.start + 1));
      return `<section class="ap2-col"><header><b>${rel(d) || md2(d)}</b><span>${+d.slice(5, 7)}월 ${+d.slice(8)}일 ${A.DOW[A.s2d(d).getDay()]}요일</span><em>${r.items.filter((x) => x.date === d).length ? `새 일정 ${r.items.filter((x) => x.date === d).length}개` : ''}</em></header>
        ${allday.length ? `<div class="ap2-ad">${allday.map((x) => `<span class="ap2-chip ${x.on ? '' : 'off'}">${MARKV}${A.esc(x.title)}<small>종일</small></span>`).join('')}</div>` : ''}
        ${!r.items.some((x) => x.date === d && x.start != null) ? `<p class="ap2-none">시간이 정해진 새 일정은 없어요. 그날 다른 일정 ${A.onDay(d).filter((t) => !t.until).length}개</p>` : `<div class="ap2-g" style="height:${(hi - lo) * PX}px">${hrs.map((h) => `<span class="ap2-hr" style="top:${y(h)}px"><em>${A.hmc(h)}</em></span>`).join('')}
        ${ev.map((t) => `<div class="ap2-ev" style="top:${y(t.start)}px;height:${hgt(t.start, t.end ?? t.start + 1)}px"><b>${A.esc(t.title)}</b><small>${A.hmd(t.start)}</small></div>`).join('')}
        ${mine.filter((x) => x.start != null).map((x) => `<div class="ap2-new ${x.on ? '' : 'off'} ${over(x) ? 'half' : ''}" style="top:${y(x.start)}px;height:${hgt(x.start, x.end ?? x.start + 1)}px"><b>${MARKV}${A.esc(x.title)}</b><small>${A.hmd(x.start)} ~ ${A.hmd(x.end ?? x.start + 1)}${x.clash ? ', 겹침' : ''}</small></div>`).join('')}</div>`}</section>`; }).join('')}</div>${m.done ? tableV(m, i) : ''}`; };
  const MARKV = `<svg class="i ap-mk" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 16l8-8M12 16l4-4M8 12l4-4"/></svg>`;
  const JOB = {
    /* 1 작업 기록: 시각과 단계, 결과는 표 */
    1: (m, i) => { const { st, k } = stInfo(m), [sc, sl] = state(m);
      return `<article class="ap ap1"><header class="ap-hd"><time>${clk()}</time><p class="ap-q">${A.esc(m.q)}</p><span class="ap-st ${sc}">${sl}</span></header>
        <ol class="ap1-log">${st.map((s, j) => (j > k && !m.done ? '' : `<li class="${!m.done && j === k ? 'on' : ''}"><span class="t">${secs(m.ts[j] || 0)}</span><span class="x">${!m.done && j === k ? s[0] : `${s[4]}, ${s[5]}`}</span></li>`)).join('')}</ol>
        ${m.done ? `<p class="ap-say">${sayTxt(m)}</p>${resV(m, i)}${actsV(m, i)}` : ''}</article>`; },
    /* 2 캘린더 미리보기: 들어갈 자리를 그날 칸에 */
    2: (m, i) => { const { st, k, n } = stInfo(m), [sc, sl] = state(m);
      return `<article class="ap ap2"><header class="ap-hd"><p class="ap-q">${A.esc(m.q)}</p><span class="ap-st ${sc}">${sl}</span></header>
        ${m.done ? `<p class="ap-say">${sayTxt(m)}</p>` : `<div class="ap2-run"><div class="ap-seg" style="--n:${n}">${st.map((_, j) => `<i class="${j < k ? 'ok' : j === k ? 'on' : ''}"></i>`).join('')}</div><span>${st[k][0]}</span></div>`}
        ${calV(m, i)}${actsV(m, i)}</article>`; },
    /* 3 바뀔 내용 목록: 추가는 +, 옮김은 날짜 둘 */
    3: (m, i) => { const { st, k } = stInfo(m), r = m.r, total = m.ts[st.length] || 0;
      const lines = !m.done ? st.map((s, j) => (j > k ? '' : `<li class="chk ${j === k ? 'on' : ''}"><span class="sg">${j === k ? '…' : '·'}</span><span>${j === k ? s[0] : `${s[2]} 확인`}</span></li>`)).join('')
        : r.kind === 'text' ? '' : r.kind === 'retro' ? `<li class="add"><span class="sg">+</span><span>회고</span><b>${r.title}</b></li>`
        : r.items.map((x, j) => `<li class="${r.kind === 'move' ? 'mv' : 'add'} ${x.on ? '' : 'off'}"><span class="sg">${r.kind === 'move' ? '~' : '+'}</span><span>${r.kind === 'move' ? '옮김' : '할 일'}</span>${tiIn(i, j, x, r)}<span class="wh">${r.kind === 'move' ? `${md2(A.TODAY)}에서 ${md2(x.date)}로` : `${whenD(x)}, ${whenT(x)}`}</span>${tgl(i, j, x, r, m)}</li>`).join('');
      return `<article class="ap ap3"><header class="ap-hd"><p class="ap-q">${A.esc(m.q)}</p></header>${m.done && r.kind !== 'text' ? `<p class="ap3-sum">확인한 것: ${st.map((s) => s[2]).join(', ')}, ${secs(total)}</p>` : ''}
        ${m.done ? `<p class="ap-say">${sayTxt(m)}</p>` : ''}<ul class="ap3-diff">${lines}</ul>${m.done && r.kind === 'retro' ? docV(m, i) : ''}${actsV(m, i)}</article>`; },
    /* 4 문서처럼: 부탁이 제목, 아래에 답과 표 */
    4: (m, i) => { const { st, k, n } = stInfo(m);
      return `<article class="ap ap4"><h2 class="ap4-h">${A.esc(m.q)}</h2><p class="ap4-meta">${m.done ? `${clk()}에 정리함, ${st.length}가지 확인` : `작성 중, ${k + 1}/${n} ${st[k][0]}`}</p>
        ${m.done ? `<p class="ap-say">${sayTxt(m)}</p>${resV(m, i)}${actsV(m, i)}` : skel(3)}</article>`; },
    /* 5 작업 카드: 단계 이름이 보이는 가로 단계 */
    5: (m, i) => { const { st, k } = stInfo(m), [sc, sl] = state(m);
      return `<article class="ap ap5"><header class="ap-hd"><p class="ap-q">${A.esc(m.q)}</p><span class="ap-st ${sc}">${sl}</span></header>
        <ol class="ap5-st">${st.map((s, j) => `<li class="${m.done || j < k ? 'ok' : j === k ? 'on' : ''}"><i aria-hidden="true"></i><span>${s[4]}</span></li>`).join('')}<li class="${m.done && m.r.kind !== 'text' ? (m.r.applied ? 'ok' : 'on') : ''}"><i aria-hidden="true"></i><span>${m.r.kind === 'text' ? '안내' : '확인'}</span></li></ol>
        ${m.done ? `<p class="ap-say">${sayTxt(m)}</p>${resV(m, i)}${actsV(m, i)}` : `<p class="ap5-now">${st[k][0]}</p>`}</article>`; },
  };
  if (JOB[AP]) {
    page = function () {
      if (!S.msgs.length) return `<div class="ag-page">${LAND[AI]()}</div>`;
      const jobs = []; for (let i = 0; i < S.msgs.length; i++) if (S.msgs[i].role === 'ai') jobs.push(JOB[AP](S.msgs[i], i));
      return `<div class="ag-page"><div class="ax-th"><div class="ax-th-in apv ap-l${AP}">${jobs.join('')}</div></div><div class="ax-dock">${composer('이어서 부탁하기')}</div></div>`;
    };
    document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('[data-aon]'); if (!b) return; e.stopPropagation(); const [i, j] = b.dataset.aon.split(':').map(Number), x = S.msgs[i].r.items[j]; x.on = !x.on; render(); document.querySelector(`[data-aon="${i}:${j}"]`)?.focus(); }, true);
  }

  /* ---------- 배경 ?bg=1..5: 빈 검정 대신 서비스 재료(점 격자, 캘린더 눈금, 빗금, 오늘 일정, 날짜)를 아주 옅게 ---------- */
  const BG = Q.has('bg') ? +Q.get('bg') || 0 : 10; /* 배경은 10번(인디고 빗금 모서리)으로 정함. ?bg=0 은 배경 없음 */
  const bgLayer = () => {
    if (BG === 2) { const ws = A.weekStart(A.TODAY), days = [...Array(7)].map((_, i) => A.add(ws, i));
      return `<div class="axbg" aria-hidden="true"><div class="bg2-h">${days.map((d) => `<span class="${d === A.TODAY ? 'on' : ''}">${A.DOW[A.s2d(d).getDay()]} ${+d.slice(8)}</span>`).join('')}</div><div class="bg2-g">${days.map((d) => `<i class="${d === A.TODAY ? 'on' : ''}"></i>`).join('')}</div></div>`; }
    if (BG === 4) { const L = A.onDay(A.TODAY).filter((t) => t.start != null && !t.until), H0 = 8, H1 = 21, y = (h) => `${((h - H0) / (H1 - H0)) * 100}%`;
      return `<div class="axbg" aria-hidden="true">${[9, 11, 13, 15, 17, 19].map((h) => `<span class="bg4-hr" style="top:${y(h)}"><em>${A.hmc(h)}</em></span>`).join('')}${L.map((t, i) => `<i class="bg4-b ${t.status}" style="top:${y(t.start)};height:calc(${y(t.end ?? t.start + 1)} - ${y(t.start)});left:${12 + (i % 3) * 26}%;--cc:${P.calC ? P.calC(t) : 'var(--primary-h)'}"></i>`).join('')}<span class="bg4-now" style="top:${y(A.NOW)}"></span></div>`; }
    if (BG === 9) return `<div class="axbg" aria-hidden="true"><svg class="bg9-p" viewBox="0 0 48 48"><defs><clipPath id="bg9c"><rect x="6" y="6" width="36" height="36" rx="7"/></clipPath></defs><g clip-path="url(#bg9c)" class="hl">${[...Array(16)].map((_, k) => `<path d="M${k * 3 - 18} 6l36 36"/>`).join('')}</g><rect class="bd" x="6" y="6" width="36" height="36" rx="7"/><rect class="ey" x="14" y="17" width="4" height="8" rx="1.2"/><rect class="ey" x="24" y="17" width="4" height="8" rx="1.2"/></svg></div>`;
    if (BG === 5) return `<div class="axbg" aria-hidden="true"><span class="bg5-d">${+A.TODAY.slice(5, 7)}.${A.TODAY.slice(8)}</span><span class="bg5-w">${A.DOW[A.s2d(A.TODAY).getDay()]}요일</span></div>`;
    return BG ? '<div class="axbg" aria-hidden="true"></div>' : '';
  };
  if (BG) { const pageB = page; page = function () { return pageB().replace('<div class="ag-page">', `<div class="ag-page bgx bg${BG} ${S.msgs.length ? 'talk' : 'land'}">${bgLayer()}`); }; CFG.name = `${CFG.name ? CFG.name + ', ' : ''}배경 ${BG}`; }
  P.todayBtn = () => '';
  $('#app').insertAdjacentHTML('afterbegin', P.shell('ai'));
  A.init(render);
  render();
  if (Q.get('q')) setTimeout(() => send(Q.get('q')), 200);
  else if (Q.get('demo')) setTimeout(() => send(Q.get('demo') === 'retro' ? '오늘 회고 써줘' : SEED), 1600);
  else { const c = $('#cmp'); c && c.focus({ preventScroll: true }); }
</script>
</body>
</html>
