<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나머지 화면 시안</title>
<meta name="description" content="알림, 검색, 빈 화면, 로딩, 오류, GitHub 연결, 데모, 로그인 시안을 실제 화면에서 비교한다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<style>
  /* Hallmark · scope: app screen (시안 비교 페이지) · genre: atmospheric · theme: project tokens (ARCHIVE dark, shared.css) · signature: 실제 화면을 상태별로 바꿔 끼우는 비교 · states: 8 · mode: fast · v2.0.0 */
  /* critique: states are easy to forget in a gallery of happy paths, so each one is a live page with the same data and shell. */
  body{height:auto;min-height:100%}
  .wrap{padding:28px 24px 64px;max-width:1480px;margin:0 auto}
  h1{margin:0 0 6px;font-size:18px;font-weight:600;text-wrap:balance}
  .lead{margin:0 0 20px;color:var(--ink3);font-size:13px;max-width:92ch;line-height:1.6}
  .tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;background:var(--canvas);border-bottom:1px solid var(--line);margin-bottom:20px}
  .tabs a{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--ink3)}.tabs a:hover{background:var(--s3);color:var(--ink)}.tabs a:focus-visible{outline:2px solid var(--primary-h);outline-offset:2px}
  section{margin:0 0 40px;scroll-margin-top:60px}
  .hd{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
  h2{margin:0;font-size:14px;font-weight:600;white-space:nowrap}
  .hd p{margin:0;flex:1;font-size:12px;color:var(--ink3);line-height:1.5}
  .st{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
  .st button{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line2);font-size:12px;color:var(--ink3)}.st button:hover{background:var(--s3);color:var(--ink)}.st button[aria-pressed="true"]{border-color:var(--primary);color:var(--ink);background:var(--primary-a)}.st button:focus-visible,.st a:focus-visible{outline:2px solid var(--primary-h);outline-offset:2px}
  .st a{margin-left:auto;font-size:12px;color:var(--primary-h);align-self:center}
  iframe{display:block;width:100%;height:760px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}iframe:focus,iframe.kf{outline:2px solid var(--primary-h);outline-offset:2px}
  @media (max-width:640px){.hd{flex-direction:column;gap:4px}h2{white-space:normal}.wrap{padding:20px 16px 48px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>나머지 화면</h1>
  <p class="lead">지금까지의 시안이 다루지 않던 화면입니다. 모두 실제 화면 위에서 동작합니다.</p>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
</div>
<script>
  const L = [
    ['nt', '알림', '오른쪽 줄의 벨을 누르면 패널이 열립니다. 회고와 AI 탭에는 오른쪽 줄이 없어 상단 검색 옆에 벨이 있습니다.', [['캘린더', 'd-calendar.html?ntopen=1'], ['할 일', 'd-todos.html?ntopen=1'], ['회고', 'd-retro2.html?ntopen=1']]],
    ['cp', '검색과 명령 (Ctrl+K)', '범위 탭으로 전체, 할 일, 회고, 명령을 나눕니다. Tab으로 범위를 바꿉니다.', [['캘린더', 'd-calendar.html?cpopen=1'], ['회고', 'd-retro2.html?cpopen=1']]],
    ['em', '빈 화면', '캘린더와 할 일은 비어 있는 그대로 보입니다. 회고만 안내 문구가 나옵니다.', [['캘린더', 'd-calendar.html?empty=1'], ['할 일', 'd-todos.html?empty=1'], ['회고', 'd-retro2.html?empty=1']]],
    ['ld', '로딩', '데이터를 받아 오는 동안의 자리 표시입니다.', [['캘린더', 'd-calendar.html?load=1'], ['할 일', 'd-todos.html?load=1'], ['회고', 'd-retro2.html?load=1']]],
    ['fl', '오류', '실패한 범위에 따라 표현을 나눴습니다.', [['불러오기 실패', 'd-calendar.html?err=load'], ['인터넷 끊김', 'd-calendar.html?err=offline'], ['저장 실패', 'd-calendar.html?err=save'], ['로그인 만료', 'd-calendar.html?err=expired'], ['찾을 수 없음 404', 'd-auth.html?v=404'], ['서버 오류 500', 'd-auth.html?v=500']]],
    ['gh', 'GitHub 연결 전과 후', '계정 유형을 없앴습니다. GitHub을 연결하면 커밋 탭과 저장소 설정이 나타납니다.', [['연결 전: 캘린더', 'd-calendar.html?gh=0'], ['연결 전: 연동 설정', 'd-settings.html?gh=0#link'], ['연결 전: AI 설정', 'd-settings.html?gh=0#ai'], ['연결 후: 캘린더', 'd-calendar.html?gh=1'], ['연결 후: 연동 설정', 'd-settings.html?gh=1#link']]],
    ['dm', '데모 모드', '위쪽 띠로 저장되지 않음을 알립니다. 사이드바의 연동 문제 버튼을 누르면 로그인 안내가 나옵니다.', [['캘린더', 'd-calendar.html?demo=1'], ['할 일', 'd-todos.html?demo=1']]],
    ['fw', '로그인과 가입', '폼은 가운데에 있고, Google과 GitHub은 이메일 입력 아래에 있습니다.', [['로그인', 'd-auth.html'], ['이메일', 'd-auth.html?v=signup'], ['코드 확인', 'd-auth.html?v=code'], ['프로필', 'd-auth.html?v=profile'], ['국가 선택(소셜 가입)', 'd-auth.html?v=onboard'], ['비밀번호 찾기', 'd-auth.html?v=forgot'], ['메일 보냄', 'd-auth.html?v=sent'], ['새 비밀번호', 'd-auth.html?v=reset'], ['변경 완료', 'd-auth.html?v=resetok'], ['링크 만료', 'd-auth.html?v=expired']]],
  ];
  const $ = (q) => document.querySelector(q);
  $('#tabs').innerHTML = L.map(([k, t]) => `<a href="#v${k}">${t.split(' (')[0]}</a>`).join('');
  $('#list').innerHTML = L.map(([k, t, d, st]) => `<section id="v${k}"><div class="hd"><h2>${t}</h2><p>${d}</p></div><div class="st" role="group" aria-label="${t}">${st.map(([l, u], i) => `<button type="button" data-k="${k}" data-u="${u}" aria-pressed="${i === 0}">${l}</button>`).join('')}<a id="a${k}" href="${st[0][1]}" target="_blank" rel="noopener">이걸로 보기</a></div><iframe id="f${k}" title="${t}" loading="lazy" src="${st[0][1]}"></iframe></section>`).join('');
  document.addEventListener('click', (e) => { const b = e.target.closest('.st button'); if (!b) return; b.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); const f = $('#f' + b.dataset.k), u = b.dataset.u; $('#a' + b.dataset.k).href = u; f.src = 'about:blank'; setTimeout(() => { f.src = u; }, 30); });
  const mark = () => document.querySelectorAll('iframe').forEach((f) => f.classList.toggle('kf', document.activeElement === f));
  window.addEventListener('blur', () => setTimeout(mark, 0)); window.addEventListener('focus', mark);
</script>
</body>
</html>
