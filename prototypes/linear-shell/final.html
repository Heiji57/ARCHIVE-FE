<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVE 전체 디자인</title>
<meta name="description" content="지금까지 고른 시안을 기본으로 둔 ARCHIVE 전체 화면. 왼쪽에서 화면과 상태를 고르면 오른쪽에서 실제로 눌러 볼 수 있다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<style>
  /* Hallmark · scope: app screen (전체 디자인 둘러보기) · genre: atmospheric · theme: project tokens (ARCHIVE dark, shared.css) · signature: 고른 시안이 모두 들어간 실제 화면을 한 창에서 넘겨 봄 · states: 8 · mode: fast · v2.0.0 */
  /* critique: decisions were scattered over a dozen comparison pages; this puts the chosen version of every screen and its key states behind one list. */
  html, body { height: 100%; overflow-x: clip; }
  body { background: var(--canvas); }
  .fx { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100%; }
  .nv { display: flex; flex-direction: column; gap: 16px; min-height: 0; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--s1); overflow-y: auto; }
  .nv h1 { margin: 0 8px; font-size: 16px; font-weight: 600; letter-spacing: -0.2px; color: var(--ink); text-wrap: balance; }
  .nv > p { margin: -8px 8px 0; font-size: 12px; line-height: 1.5; color: var(--ink3); }
  .gp h2 { margin: 0 8px 4px; font-size: 12px; font-weight: 500; color: var(--ink3); }
  .gp ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
  .gp button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 6px 8px; border-radius: var(--r); text-align: left; }
  .gp button b { font-size: 13px; font-weight: 500; color: var(--ink2); }
  .gp button small { font-size: 12px; color: var(--ink3); }
  .gp button:hover { background: var(--s3); }
  .gp button:hover b { color: var(--ink); }
  .gp button[aria-current="true"] { background: var(--primary-a); }
  .gp button[aria-current="true"] b { color: var(--ink); }
  .gp button:focus-visible, .tb a:focus-visible, iframe.kf, iframe:focus { outline: 2px solid var(--primary-h); outline-offset: -2px; }
  .gp button:active { transform: scale(.98); }
  .mn { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tb { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .tb p { flex: 1; min-width: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--ink3); }
  .tb p b { font-weight: 500; color: var(--ink); margin-right: 8px; }
  .tb a { flex: none; font-size: 13px; color: var(--primary-h); }
  iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: var(--canvas); }
  @media (prefers-reduced-motion: reduce) { .gp button:active { transform: none; } }
  @media (max-width: 760px) {
    .fx { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .nv { max-height: 40vh; padding: 12px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
    .tb { padding: 0 16px; }
  }
</style>
</head>
<body>
<div class="fx">
  <nav class="nv" aria-label="화면 고르기">
    <h1>ARCHIVE 전체 디자인</h1>
    <p>지금까지 고른 시안이 기본으로 들어가 있어요. 오른쪽 화면은 모두 눌러서 동작해요.</p>
    <div id="groups"></div>
  </nav>
  <main class="mn">
    <div class="tb"><p id="cap"></p><a id="pop" href="#" target="_blank" rel="noopener">새 탭에서 열기</a></div>
    <iframe id="view" title="선택한 화면"></iframe>
  </main>
</div>
<script>
  const G = [
    ['주요 화면', [
      ['AI', '가운데 입력 바로 시작하는 비서. 결과는 캘린더 미리보기(2), 배경은 인디고 빗금 모서리(10), 알림 없음', 'd-ai.html'],
      ['캘린더, 주간', '오른쪽 패널 6번, 오른쪽 줄의 AI 추천 버튼', 'd-calendar.html'],
      ['패널 탭: 하루 2, 마감 2, 커밋 4', '지금과 다음, 일주일 띠, 세로 시간 줄', 'd-calendar.html?rtab=day'],
      ['캘린더, 월간', '위아래로 이어지는 달', 'd-calendar.html?view=month'],
      ['할 일', '날짜별 열과 오른쪽 패널, 시간표 탭', 'd-todos.html'],
      ['회고', '고른 요소로 만든 회고 화면', 'd-retro2.html'],
      ['회고 주제 목록', '회고 카드와 같은 뼈대, 한 줄에 두 장, 주제 이름을 주제 색으로 크게, 주제 색 책갈피', 'd-retro2.html?area=topic&tl=6'],
      ['회고 주제 목록, 좌우로 넘기기', '회고와 같은 레일에 주제 한 장씩, 최근에 한 일', 'd-retro2.html?area=topic&tvm=rail'],
      ['회고 주제 본문', '이름 크게와 책갈피, 색 점 거르기, 주로 묶은 하루 카드, 왼쪽 여백 종류 아이콘, 자세히 보기', 'd-retro2.html?area=topic&tp=tp1'],
      ['회고 주제 연결', '동심원 배치(가운데 주제, 큰 주제, 회고, 할 일, 커밋 고리), 범례로 켜고 끄기, 옆 칸에 큰 주제별 자료', 'd-retro2.html?area=topic&tp=tp1&tg=1'],
      ['회고 주제, 정리 전', '같은 상단에 조용한 안내와 정리하기', 'd-retro2.html?area=topic&tp=tp4'],
      ['설정', '왼쪽 아래 사용자 메뉴로 들어감', 'd-settings.html'],
    ]],
    ['오른쪽 패널 (6)', [
      ['AI 추천 (20, 색 5), 캘린더', '오른쪽 줄 AI 버튼, 캘린더에 흐린 일정 칸', 'd-calendar.html?aip=1'],
      ['AI 추천 (20, 색 5), 할 일', '종류별 목록, 캘린더에서 보기 링크', 'd-todos.html?aip=1'],
      ['시간 미정', '넣을 시간 찾기', 'd-calendar.html?rtab=ut'],
      ['마감', '임박하거나 지난 할 일', 'd-calendar.html?rtab=due'],
      ['커밋', '그날 GitHub 커밋', 'd-calendar.html?rtab=cm'],
    ]],
    ['로고 (39)', [
      ['둥근 날개', '사이드바와 파비콘에 적용', 'logo-crest.html'],
    ]],
    ['빗금이 (AI 6)', [
      ['빗금이 열기', '오른쪽 아래 칸, 어느 화면에서나 부탁', 'd-calendar.html?petopen=1'],
      ['빗금이 끄기', '설정의 AI 맨 위', 'd-settings.html#ai'],
    ]],
    ['캘린더에서 여는 것', [
      ['할 일 모달 (26)', '가운데 모달, 값 옆 찾기 메뉴', 'd-calendar.html?select=t4'],
      ['반복 할 일 모달 (26)', '고치면 적용 범위를 물음', 'd-calendar.html?select=t5'],
      ['새 할 일 (3)', '할 일 모달과 같은 속성 줄, 상태는 더 보기', 'd-calendar.html?naopen=1'],
      ['하루 닫기, 내일로 이월 (22)', '묻고 답하기 두 단계', 'd-calendar.html?close=1'],
      ['오늘 회고를 쓴 뒤', '미니 달력에 붙은 오늘 회고', 'd-calendar.html?rdw=1'],
      ['연동 문제 없을 때', '연동 문제 줄이 사라짐', 'd-calendar.html?issues=0'],
    ]],
    ['할 일 화면에서 여는 것', [
      ['할 일 모달 (26)', '캘린더와 같은 모달, 마감일 포함', 'd-todos.html?select=t4'],
      ['하루 닫기 (22)', '캘린더와 같은 창', 'd-todos.html?close=1'],
      ['새 할 일 (3)', '캘린더와 같은 창', 'd-todos.html?naopen=1'],
    ]],
    ['공통', [
      ['알림', '오른쪽 줄의 벨', 'd-calendar.html?ntopen=1'],
      ['검색과 명령', '범위 탭, Ctrl+K', 'd-calendar.html?cpopen=1'],
      ['회고 빈 화면', '조용한 한 줄', 'd-retro2.html?empty=1'],
      ['GitHub 연결 전', '커밋 기능이 숨겨짐', 'd-calendar.html?gh=0'],
      ['로그인', '가운데 폼', 'd-auth.html'],
      ['회원가입', '이메일 아래 Google, GitHub', 'd-auth.html?v=signup'],
    ]],
    ['설정 안', [
      ['연동', 'GitHub, Google Calendar 카드', 'd-settings.html#link'],
      ['회고', '회고 템플릿 목록', 'd-settings.html#retro'],
      ['새 회고 템플릿 (문서처럼)', '템플릿 작성 1번', 'd-settings.html?tedit=new:week#retro'],
      ['할 일과 캘린더', '주 시작, 지난 일 표시', 'd-settings.html#work'],
    ]],
  ];
  const $ = (q) => document.querySelector(q), all = G.flatMap(([, l]) => l);
  $('#groups').innerHTML = G.map(([h, l]) => `<section class="gp"><h2>${h}</h2><ul>${l.map(([t, d, u]) => `<li><button type="button" data-u="${u}" aria-current="false"><b>${t}</b><small>${d}</small></button></li>`).join('')}</ul></section>`).join('');
  const go = (u, push = true) => { const it = all.find((x) => x[2] === u) || all[0];
    document.querySelectorAll('[data-u]').forEach((b) => b.setAttribute('aria-current', b.dataset.u === it[2]));
    $('#cap').innerHTML = `<b>${it[0]}</b>${it[1]}`; $('#pop').href = it[2];
    $('#view').src = 'about:blank'; setTimeout(() => { $('#view').src = it[2]; }, 20);
    if (push) try { history.replaceState(null, '', '#' + encodeURIComponent(it[2])); } catch (e) { /* 파일 열기에서는 무시 */ } };
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-u]'); if (b) go(b.dataset.u); });
  /* 키보드로 미리보기 안에 들어가면 테두리 표시 */
  const mark = () => $('#view').classList.toggle('kf', document.activeElement === $('#view'));
  window.addEventListener('blur', () => setTimeout(mark, 0)); window.addEventListener('focus', mark);
  go(decodeURIComponent(location.hash.slice(1)) || all[1][2], false);
</script>
</body>
</html>
