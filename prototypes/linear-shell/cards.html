<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 카드 시안</title>
<meta name="description" content="같은 할 일 7개를 카드 시안 다섯 가지로 나란히 비교한다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<link rel="stylesheet" href="shared/planner.css">
<style>
  body{height:auto;min-height:100%}
  .wrap{padding:28px 24px 64px}
  h1{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.2px}
  .lead{margin:0 0 24px;color:var(--ink3);font-size:13px;max-width:72ch}
  .row{display:flex;gap:0;overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .c{flex:0 0 284px;min-width:0;padding:16px 14px 24px;border-right:1px solid var(--line)}
  .c:first-child{border-left:1px solid var(--line)}
  .c.ref{opacity:.7}
  .c h2{margin:0;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:baseline}
  .c h2 .n{font-family:var(--mono);color:var(--ink4);font-weight:400}
  .c p{margin:4px 0 10px;font-size:12px;color:var(--ink3);line-height:1.5;min-height:36px}
  .c .go{display:inline-block;font-size:12px;color:var(--primary-h);margin-bottom:14px}
  .c .go:hover{text-decoration:underline}
  .c .day{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;padding-top:12px;border-top:1px solid var(--line)}
  .c .day b{font-size:14px;color:var(--primary-h)}
  .c .day span{font:500 12px var(--mono);color:var(--ink3)}
  .note{margin-top:20px;font-size:12px;color:var(--ink4)}
</style>
</head>
<body>
<div class="wrap">
  <h1>할 일 카드 시안</h1>
  <p class="lead">같은 할 일 7개를 다섯 가지 방식으로 보여 줍니다. 오늘의 할 일 5개에 기간 할 일 하나, 시간이 정해지지 않은 할 일 하나를 더했습니다. 체크박스는 눌러지고, 카드를 누르면 상세가 열립니다. "할 일 화면에서 보기"를 누르면 실제 할 일 페이지에 그 시안이 적용됩니다.</p>
  <div class="row" id="row"></div>
  <p class="note">맨 왼쪽(0)은 비교용 기존 카드입니다.</p>
</div>
<dialog id="detail" aria-label="할 일 상세"></dialog>
<script src="shared/shared.js"></script>
<script src="shared/planner.js"></script>
<script>
  const A = ARC, P = PL;
  const V = [
    [0, '기존', '둥근 상자에 예상 시간 알약, 시간 칩, 태그를 모두 따로 얹은 형태.'],
    [1, '줄 목록', '상자를 없애고 헤어라인으로만 나눔. 오른쪽에 시각 하나, 아래에 태그만.'],
    [2, '시간표', '왼쪽에 시각과 소요 시간 열을 세우고 세로선으로 하루를 읽음. 시간 미정은 아래로.'],
    [3, '색인 카드', '모서리를 거의 세우고 제목을 크게. 메타는 아랫단 한 줄 고정폭 글자로.'],
    [4, '상태 레일', '높이가 같은 두 줄 카드. 왼쪽 2px 색이 상태, 제목은 한 줄로 자름.'],
    [5, '노트', '배경 없는 체크리스트. 하는 중 / 할 일 / 끝냄으로 묶어 메모처럼 읽힘.'],
  ];
  function render() {
    const items = [...A.onDay(A.TODAY), A.byId('t13'), A.byId('t6')].filter(Boolean);
    const t = P.dayTot(A.TODAY);
    document.getElementById('row').innerHTML = V.map(([v, name, desc]) => `
      <section class="c ${v === 0 ? 'ref' : ''}" aria-label="${v}. ${name}">
        <h2><span class="n">${v}</span>${name}</h2><p>${desc}</p>
        <a class="go" href="d-todos.html?card=${v}">할 일 화면에서 보기 →</a>
        <div class="day"><b>화요일 · 오늘</b><span>${P.hmm(t.done)} / ${P.hmm(t.tot)}</span></div>
        ${P.list(items, v)}
      </section>`).join('');
    P.detail();
  }
  A.init(render);
</script>
</body>
</html>
