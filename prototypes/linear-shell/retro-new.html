<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 회고 모달 시안</title>
<meta name="description" content="회고 목록을 보는 방식 다섯 가지를 지금 카드 보기와 비교한다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<style>
  body{height:auto;min-height:100%}
  .wrap{padding:28px 24px 64px;max-width:1480px}
  h1{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-.2px}
  .lead{margin:0 0 20px;color:var(--ink3);font-size:13px;max-width:84ch;line-height:1.6}
  .tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;background:var(--canvas);border-bottom:1px solid var(--line);margin-bottom:20px}
  .tabs a{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--ink3)}
  .tabs a:hover{background:var(--s3);color:var(--ink)}
  .tabs a b{font-family:var(--mono);color:var(--ink4);margin-right:6px;font-weight:400}
  section{margin:0 0 36px;scroll-margin-top:60px}
  .hd{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
  h2{margin:0;font-size:14px;font-weight:600}
  h2 span{font-family:var(--mono);color:var(--ink4);font-weight:400;margin-right:8px}
  .hd p{margin:0;flex:1;font-size:12px;color:var(--ink3);line-height:1.5}
  .hd a{font-size:12px;color:var(--primary-h);white-space:nowrap}
  .hd a:hover{text-decoration:underline}
  iframe{display:block;width:100%;height:780px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}
  section.cur{opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <h1>새 회고 모달 시안</h1>
  <p class="lead">"+ 새 회고"를 누르면 뜨는 모달 안쪽 디자인 다섯 가지입니다. 0은 지금 모달입니다. 모두 같은 일을 합니다: 날짜(하루에 여러 편 가능), 제목(비워 두면 날짜로), 폴더를 정하고 "만들고 쓰기". 각 시안은 모달이 열린 채로 띄웠으니 안에서 직접 눌러 보세요.</p>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
</div>
<script>
  const V = [
    [0, '지금', '날짜 입력 + 오늘 · 어제 · 그제, 제목, 폴더 고르기 상자.'],
    [1, '제목 먼저 (기본)', '큰 제목 칸이 맨 위, 날짜와 폴더는 아래 작은 알약 두 개. 누르면 작은 메뉴가 열림. 대부분은 제목만 쓰고 Enter.'],
    [2, '달력', '왼쪽에 이번 달 달력(이미 쓴 날은 편수 숫자), 오른쪽에 고른 날짜 · 제목 · 폴더. 지난 날 회고를 자주 쓸 때.'],
    [3, '최근 7일', '최근 7일을 한 줄 버튼으로(쓴 편수 표시), 끝에 "다른 날". 폴더는 버튼 묶음. 누르는 횟수가 가장 적음.'],
    [4, '키보드로', '찾기 창처럼 제목을 치고 ↑↓ 로 오늘 · 어제 · 그제 · 다른 날짜를 골라 Enter. Tab 으로 폴더를 바꿈. 마우스 없이 끝남.'],
    [5, '폴더 먼저', '"어디에 쓸까요?" 폴더 카드 세 개를 먼저 고르고, 날짜 버튼과 제목. 프로젝트별로 회고를 나눠 쓸 때.'],
  ];
  document.getElementById('tabs').innerHTML = V.map(([v, n]) => `<a href="#v${v}"><b>${v}</b>${n}</a>`).join('');
  document.getElementById('list').innerHTML = V.map(([v, n, d]) => `<section id="v${v}" class="${v === 0 ? 'cur' : ''}">
    <div class="hd"><h2><span>${v}</span>${n}</h2><p>${d}</p><a href="d-retro2.html?rl=1&vm=grid&ed=0&nd=${v}&newdlg=1">이걸로 보기 →</a></div>
    <iframe src="d-retro2.html?rl=1&vm=grid&ed=0&nd=${v}&newdlg=1" title="${v}. ${n}" loading="lazy" style="height:640px"></iframe></section>`).join('');
</script>
</body>
</html>
