<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVE 시안 D · 회고</title>
<meta name="description" content="회고 페이지 시안. ?rv=1~10 으로 바꿔 본다. 6~10 은 문서 도구에서 가져온 아이디어.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<link rel="stylesheet" href="shared/planner.css">
<style>
  /* 회고 페이지는 오른쪽 패널 · 아이콘 줄 없이 본문을 넓게 */
  .app.rt{grid-template-columns:232px minmax(0,1fr) 0 0}
  .app.rt.no-side{grid-template-columns:0 minmax(0,1fr) 0 0}
  body.sbv4 .app.rt.no-side{grid-template-columns:52px minmax(0,1fr) 0 0}
  @media (max-width:1000px){.app.rt,.app.rt.no-side{grid-template-columns:0 minmax(0,1fr) 0 0}}
  .app.rt .rp,.app.rt .strip{display:none}
  .rmain{grid-column:2;grid-row:2;min-width:0;min-height:0;position:relative;overflow:hidden}
  .top .r-sub{font-size:12px;color:var(--ink4);white-space:nowrap}

  /* 공통 조각 */
  .r-ty{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;font-size:12px;font-weight:500;color:var(--ink2);background:var(--s3);border:1px solid var(--line)}
  .r-ty.ai{color:var(--primary-h);background:var(--primary-a);border-color:transparent}
  .r-ty svg{width:11px;height:11px}
  .r-sync{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3);white-space:nowrap}
  .r-sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .r-sync.on::before{background:var(--done)}
  .r-sync.no::before{background:transparent;border:1.5px dashed var(--ink4);width:5px;height:5px}
  .seg2{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--r);background:var(--s1)}
  .seg2 button{height:24px;padding:0 9px;border-radius:4px;font-size:12px;color:var(--ink3)}
  .seg2 button:hover{color:var(--ink)}
  .seg2 button[aria-pressed=true]{background:var(--s4);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  .srch{display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--s1);color:var(--ink4)}
  .srch input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:13px;color:var(--ink)}
  .srch:focus-within{border-color:var(--line2)}
  .r-bt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r);font-size:13px;color:var(--ink2);border:1px solid var(--line2);background:var(--s1);white-space:nowrap}
  .r-bt:hover{background:var(--s3);color:var(--ink)}
  .r-bt.p{background:var(--primary);border-color:var(--primary);color:#fff}
  .r-bt.p:hover{background:#6d78dc}
  .r-bt.r-g{border-color:transparent;background:none;color:var(--ink3)}
  .r-bt.r-g:hover{background:var(--s3);color:var(--ink)}
  .r-bt svg{width:14px;height:14px}

  /* 문서 (모든 시안이 같은 편집기를 씀) */
  .r-doc{max-width:720px;margin:0 auto;padding:36px 40px 80px}
  .doc-m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink3)}
  .doc-m .r-fold{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:4px;color:var(--ink3)}
  .doc-m .r-fold:hover{background:var(--s3);color:var(--ink)}
  .doc-m .r-fold svg{width:12px;height:12px}
  .doc-t{display:block;width:100%;margin:14px 0 4px;border:0;background:none;outline:0;font-size:26px;font-weight:650;letter-spacing:-.5px;color:var(--ink);padding:0}
  .doc-t::placeholder{color:var(--ink4)}
  .doc-t[readonly]{cursor:default}
  .doc-h{margin:0 0 22px;font-size:12px;color:var(--ink4)}
  .doc-b{outline:0;font-size:14px;line-height:1.75;color:var(--ink2);min-height:120px}
  .doc-b h2{margin:26px 0 6px;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
  .doc-b h2:first-child{margin-top:0}
  .doc-b p{margin:0 0 8px}
  .doc-b ul{margin:0 0 8px;padding-left:20px}
  .doc-b li{margin:2px 0}
  .doc-b li::marker{color:var(--ink4)}
  .doc-b code{font:13px var(--mono);background:var(--s3);padding:1px 5px;border-radius:4px;color:var(--ink)}
  .doc-b:empty::before{content:attr(data-ph);color:var(--ink4)}
  .banner{display:flex;align-items:center;gap:10px;margin:0 0 22px;padding:9px 12px;border-radius:var(--r);background:var(--primary-a);font-size:13px;color:var(--ink2)}
  .banner b{display:inline-flex;align-items:center;gap:5px;color:var(--primary-h);font-weight:600}
  .banner b svg{width:13px;height:13px}
  .banner span{flex:1}
  .banner.wait{background:var(--s2);border:1px solid var(--line)}
  .r-spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--primary-h);animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .r-start{display:flex;gap:8px;margin:6px 0 0}
  .r-start .r-bt{height:32px}
  /* 재료: 그날 끝낸 일 · 커밋 */
  .r-mat{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
  .r-mat h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink3)}
  .r-mat h3 em{font:500 12px var(--mono);color:var(--ink4);font-style:normal}
  .r-mat h3 .r-bt{margin-left:auto;height:22px;font-size:12px;padding:0 7px}
  .r-mr{display:flex;align-items:center;gap:9px;min-height:28px;padding:3px 8px;border-radius:5px;font-size:13px;color:var(--ink2)}
  .r-mr:hover{background:var(--s2)}
  .r-ck{width:14px;height:14px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--done);color:#fff}
  .r-mr .r-ck,.r-mr .r-cm{flex:none}
  .r-ck svg{width:9px;height:9px;stroke-width:3}
  .r-ck.o{background:none;border:1.5px solid var(--ink4)}
  .r-ck.d{background:none;border:1.5px solid var(--primary);position:relative}
  .r-ck.d::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--primary);clip-path:inset(0 50% 0 0)}
  .r-mr .r-cm{flex:none;width:14px;color:var(--ink4);display:grid;place-items:center}
  .r-mr .r-cm svg{width:13px;height:13px}
  .r-mr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-mr em{font:500 12px var(--mono);color:var(--ink4);font-style:normal;white-space:nowrap}
  .r-none{margin:0;font-size:13px;color:var(--ink4);padding:2px 8px}

  /* ===== 1. 문서 3단 ===== */
  .v1{display:grid;grid-template-columns:272px minmax(0,1fr) 228px;height:100%}
  .v1 .r-ls{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--canvas)}
  .v1 .ls-h{padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
  .v1 .ls-h .seg2{display:flex}
  .v1 .ls-h .seg2 button{flex:1}
  .v1 .ls-b{flex:1;overflow:auto;padding:6px 8px 24px}
  .v1 .r-gh{position:sticky;top:-6px;z-index:1;background:var(--canvas);padding:12px 6px 6px;font:600 12px var(--mono);color:var(--ink4);letter-spacing:.04em}
  .v1 .r-it{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 8px;align-items:center;width:100%;padding:8px;border-radius:6px;text-align:left}
  .v1 .r-it:hover{background:var(--s2)}
  .v1 .r-it[aria-current=true]{background:var(--s3);box-shadow:inset 2px 0 var(--primary)}
  .v1 .r-it .r-dt{grid-row:1/3;display:flex;flex-direction:column;align-items:center;line-height:1.1}
  .v1 .r-it .r-dt b{font:500 16px var(--mono);color:var(--ink)}
  .v1 .r-it .r-dt small{font-size:12px;color:var(--ink4)}
  .v1 .r-it .r-dt.sun small{color:var(--sun)}
  .v1 .r-it .r-dt.sat small{color:var(--sat)}
  .v1 .r-it .r-tt{font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v1 .r-it .r-ex{grid-column:2/4;font-size:12px;color:var(--ink4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v1 .r-it.r-empty .r-tt{color:var(--ink3)}
  .v1 .r-it.r-empty{border:1px dashed var(--line2);margin-bottom:4px}
  .v1 .r-it .r-sync{font-size:0;gap:0}
  .v1 .r-ed{overflow:auto;min-width:0}
  .v1 .r-rl{border-left:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:18px;overflow:auto;background:var(--s1)}
  .v1 .r-rl h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink4);letter-spacing:.04em}
  .v1 .r-rl .r-bt{width:100%;justify-content:center}
  .v1 .r-rl .r-grp{display:flex;flex-direction:column;gap:6px}
  .v1 .r-rl .r-st{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink3);height:22px}
  .v1 .r-rl .r-st b{font:500 12px var(--mono);color:var(--ink)}
  .v1 .r-toc a{display:block;padding:4px 8px;border-radius:4px;font-size:13px;color:var(--ink3);border-left:1px solid var(--line)}
  .v1 .r-toc a:hover{color:var(--ink);border-color:var(--primary)}
  .v1 .r-saved{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
  .v1 .r-saved svg{width:13px;height:13px}

  /* ===== 2. 피드 ===== */
  .v2{height:100%;overflow:auto}
  .v2 .r-fd{max-width:820px;margin:0 auto;padding:28px 32px 120px}
  .v2 .r-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:20px;position:relative}
  .v2 .r-row::before{content:"";position:absolute;left:37px;top:0;bottom:0;width:1px;background:var(--line)}
  .v2 .r-gut{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 0;background:var(--canvas);z-index:1}
  .v2 .r-gut b{font:500 24px/1 var(--mono);color:var(--ink)}
  .v2 .r-gut small{font-size:12px;color:var(--ink4)}
  .v2 .r-gut .r-mo{font:600 12px var(--mono);color:var(--ink4);letter-spacing:.06em}
  .v2 .r-gut.sun small{color:var(--sun)}
  .v2 .r-gut.sat small{color:var(--sat)}
  .v2 .r-gut.today b{color:var(--primary-h)}
  .v2 .r-post{margin:0 0 18px;padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--s1)}
  .v2 .r-post:hover{border-color:var(--line2)}
  .v2 .r-post h3{margin:0 0 10px;font-size:16px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
  .v2 .r-post h3 button{text-align:left}
  .v2 .r-post h3 button:hover{text-decoration:underline;text-underline-offset:3px}
  .v2 .r-post .doc-b{font-size:14px;line-height:1.7}
  .v2 .r-post .doc-b h2{font-size:14px;margin:14px 0 4px}
  .v2 .r-post.clip .doc-b{max-height:156px;overflow:hidden;-webkit-mask:linear-gradient(#000 60%,transparent)}
  .v2 .r-post .r-ft{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--ink4)}
  .v2 .r-post .r-ft .r-mc{display:inline-flex;align-items:center;gap:4px}
  .v2 .r-post .r-ft svg{width:12px;height:12px}
  .v2 .r-post .r-ft .r-more{margin-left:auto;color:var(--ink3);font-size:12px}
  .v2 .r-post .r-ft .r-more:hover{color:var(--ink)}
  .v2 .r-post.compose{border-color:color-mix(in srgb,var(--primary) 45%,var(--line));background:linear-gradient(var(--s1),var(--s1)) padding-box}
  .v2 .r-post.compose .doc-b{min-height:96px}
  .v2 .r-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .v2 .chip2{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:var(--s3);font-size:12px;color:var(--ink2)}
  .v2 .chip2 svg{width:12px;height:12px;color:var(--ink4)}
  .v2 .r-gap{margin:0 0 18px;display:flex;align-items:center;gap:10px;height:32px;padding:0 14px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--ink4)}
  .v2 .r-gap button{margin-left:auto;color:var(--ink3);font-size:12px}
  .v2 .r-gap button:hover{color:var(--primary-h)}
  .v2 .r-wk{margin:4px 0 26px;padding:16px 20px;border-radius:10px;background:var(--primary-a);border:1px solid color-mix(in srgb,var(--primary) 35%,transparent)}
  .v2 .r-wk .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--primary-h);font-weight:600}
  .v2 .r-wk .hd svg{width:13px;height:13px}
  .v2 .r-wk .hd span{color:var(--ink3);font-weight:400;font-family:var(--mono)}
  .v2 .r-wk h3{margin:0 0 6px;font-size:16px;font-weight:600}
  .v2 .r-wk .doc-b{font-size:13px;line-height:1.65;max-height:110px;overflow:hidden;-webkit-mask:linear-gradient(#000 55%,transparent)}
  .v2 .r-wk.r-full .doc-b{max-height:none;-webkit-mask:none}
  .v2 .r-wk .r-more{margin-top:6px;font-size:12px;color:var(--primary-h)}
  .v2 .mh{margin:26px 0 14px 96px;font:600 12px var(--mono);color:var(--ink3);letter-spacing:.06em}

  /* ===== 3. 잔디 + 하루 ===== */
  .v3{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
  .v3 .hm{display:flex;gap:28px;align-items:flex-end;padding:18px 24px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
  .v3 .gr{display:grid;grid-template-columns:22px repeat(var(--w),14px);grid-template-rows:16px 12px repeat(7,14px);gap:3px;flex:none}
  .v3 .gr .r-ml{font:500 12px var(--mono);color:var(--ink4);white-space:nowrap;grid-row:1}
  .v3 .gr .r-wl{font-size:12px;color:var(--ink4);line-height:14px;grid-column:1}
  .v3 .gr .r-ws{grid-row:2;display:grid;place-items:center}
  .v3 .gr .r-ws button{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;background:var(--primary)}
  .v3 .gr .r-ws button:hover{background:var(--primary-h)}
  .v3 .gr .r-c{width:14px;height:14px;border-radius:3px;background:var(--s3);outline-offset:1px}
  .v3 .gr .r-c:hover{outline:1px solid var(--ink3)}
  .v3 .gr .r-c.l1{background:color-mix(in srgb,var(--primary) 40%,var(--s3))}
  .v3 .gr .r-c.l2{background:color-mix(in srgb,var(--primary) 70%,var(--s3))}
  .v3 .gr .r-c.l3{background:var(--primary-h)}
  .v3 .gr .r-c.fut{background:none;border:1px dashed var(--line)}
  .v3 .gr .r-c.r-cm:not(.l1):not(.l2):not(.l3){background:var(--s4);box-shadow:inset 0 0 0 1px var(--line2)}
  .v3 .gr .r-c.today{outline:1.5px solid var(--primary-h)}
  .v3 .gr .r-c[aria-current=true]{outline:2px solid var(--ink)}
  .v3 .r-kpi{display:flex;gap:10px;flex:none}
  .v3 .r-kpi div{min-width:104px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--s1)}
  .v3 .r-kpi b{display:block;font:600 20px var(--mono);color:var(--ink)}
  .v3 .r-kpi span{font-size:12px;color:var(--ink3)}
  .v3 .r-lg{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink4);margin-top:8px}
  .v3 .r-lg i{width:10px;height:10px;border-radius:2px;background:var(--s3)}
  .v3 .r-body{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
  .v3 .r-day{border-right:1px solid var(--line);overflow:auto;padding:16px 16px 40px;background:var(--s1)}
  .v3 .day-h{display:flex;align-items:center;gap:6px;margin-bottom:14px}
  .v3 .day-h b{flex:1;font-size:16px;font-weight:600}
  .v3 .day-h .ibtn{width:26px;height:26px}
  .v3 .r-tl{position:relative;padding-left:56px}
  .v3 .r-tl::before{content:"";position:absolute;left:47px;top:6px;bottom:6px;width:1px;background:var(--line2)}
  .v3 .r-tle{position:relative;margin:0 0 10px;font-size:13px;color:var(--ink2);line-height:1.4}
  .v3 .r-tle time{position:absolute;left:-56px;width:42px;text-align:right;font:500 12px var(--mono);color:var(--ink4);top:2px}
  .v3 .r-tle::before{content:"";position:absolute;left:-12px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--tc,var(--ink4));box-shadow:0 0 0 3px var(--s1)}
  .v3 .r-tle.cmt::before{border-radius:1px;transform:rotate(45deg);background:var(--ink3)}
  .v3 .r-tle small{display:block;font:500 12px var(--mono);color:var(--ink4)}
  .v3 .r-tle.cmt span{font-family:var(--mono);font-size:12px}
  .v3 .r-ed{overflow:auto}
  .v3 .r-empty{max-width:520px;margin:80px auto;text-align:center;color:var(--ink3);font-size:13px}
  .v3 .r-empty h3{margin:0 0 6px;font-size:18px;color:var(--ink);font-weight:600}
  .v3 .r-empty .r-start{justify-content:center;margin-top:16px}

  /* ===== 4. 가이드 (Keep · Problem · Try) ===== */
  .v4{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
  .v4 .src2{border-right:1px solid var(--line);background:var(--s1);overflow:auto;padding:14px 12px 40px}
  .v4 .src2 h4{margin:16px 4px 6px;font-size:12px;font-weight:600;color:var(--ink4);letter-spacing:.04em;display:flex;gap:6px}
  .v4 .src2 h4 em{font:500 12px var(--mono);font-style:normal}
  .v4 .src2 h4:first-of-type{margin-top:4px}
  .v4 .r-hint{margin:0 4px 6px;font-size:12px;color:var(--ink4);line-height:1.5}
  .v4 .r-sc{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--ink2);cursor:grab;border:1px solid transparent}
  .v4 .r-sc:hover{background:var(--s3);border-color:var(--line)}
  .v4 .r-sc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v4 .r-sc .r-to{display:none;gap:2px}
  .v4 .r-sc:hover .r-to,.v4 .r-sc:focus-within .r-to{display:flex}
  .v4 .r-sc .r-to button{width:22px;height:20px;border-radius:4px;font:600 12px var(--mono);color:var(--ink3);border:1px solid var(--line2);background:var(--s1)}
  .v4 .r-sc .r-to button:hover{color:#fff;background:var(--kc);border-color:var(--kc)}
  .v4 .r-sc.r-used{opacity:.45}
  .v4 .r-sc .r-cm,.v4 .r-sc .r-ck{flex:none}
  .v4 .r-main{overflow:auto;padding:22px 28px 60px}
  .v4 .mhd{display:flex;align-items:center;gap:8px;margin:0 0 18px}
  .v4 .mhd b{font-size:20px;font-weight:650;letter-spacing:-.4px}
  .v4 .mhd .ibtn{width:28px;height:28px}
  .v4 .mhd .r-sp{flex:1}
  .v4 .kpt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .v4 .r-kc{display:flex;flex-direction:column;min-height:260px;border:1px solid var(--line);border-radius:10px;background:var(--s1);border-top:2px solid var(--kc)}
  .v4 .r-kc.drop{background:color-mix(in srgb,var(--kc) 10%,var(--s1));border-color:var(--kc)}
  .v4 .kc-h{display:flex;align-items:baseline;gap:8px;padding:12px 14px 8px}
  .v4 .kc-h b{font-size:14px;font-weight:600}
  .v4 .kc-h small{font-size:12px;color:var(--ink4)}
  .v4 .kc-h em{margin-left:auto;font:600 12px var(--mono);color:var(--kc);font-style:normal}
  .v4 .r-kl{flex:1;display:flex;flex-direction:column;gap:6px;padding:0 10px}
  .v4 .r-ki{position:relative;padding:8px 26px 8px 10px;border-radius:6px;background:var(--s2);border:1px solid var(--line);font-size:13px;line-height:1.45}
  .v4 .r-ki [contenteditable]{outline:0}
  .v4 .r-ki q{display:block;margin-top:4px;font-size:12px;color:var(--ink4);quotes:none}
  .v4 .r-ki q::before{content:"↳ "}
  .v4 .r-ki .r-x{position:absolute;right:4px;top:6px;width:18px;height:18px;border-radius:4px;color:var(--ink4);display:none;place-items:center}
  .v4 .r-ki:hover .r-x{display:grid}
  .v4 .r-ki .r-x:hover{background:var(--s4);color:var(--ink)}
  .v4 .r-ki .r-x svg{width:11px;height:11px}
  .v4 .r-ki .tm2{margin-top:6px;font-size:12px;color:var(--primary-h)}
  .v4 .r-ki .tm2:hover{text-decoration:underline}
  .v4 .r-ki .tm2.sent{color:var(--done);pointer-events:none}
  .v4 .kadd{margin:6px 10px 10px;display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:6px;border:1px dashed var(--line2);color:var(--ink4)}
  .v4 .kadd input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:13px;color:var(--ink)}
  .v4 .kadd:focus-within{border-style:solid;border-color:var(--kc)}
  .v4 .kadd svg{width:13px;height:13px}
  .v4 .r-one{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--s1);padding:12px 14px}
  .v4 .r-one label{display:block;font-size:12px;font-weight:600;color:var(--ink4);margin-bottom:6px;letter-spacing:.04em}
  .v4 .r-one textarea{width:100%;min-height:54px;resize:vertical;border:0;background:none;outline:0;font-size:14px;line-height:1.6;color:var(--ink)}
  .v4 .foot2{display:flex;align-items:center;gap:10px;margin-top:14px}
  .v4 .foot2 .r-sp{flex:1}

  /* ===== 5. 갤러리 + 옆 미리보기 ===== */
  .v5{height:100%;overflow:auto}
  .v5 .r-gw{padding:20px 28px 80px;max-width:1280px}
  .v5 .r-gt{display:flex;align-items:center;gap:10px;margin:0 0 16px;flex-wrap:wrap}
  .v5 .r-gt .srch{width:240px}
  .v5 .r-bc{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink3);margin:0 0 12px}
  .v5 .r-bc button:hover{color:var(--ink)}
  .v5 .r-bc b{color:var(--ink);font-weight:500}
  .v5 .r-fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:0 0 22px}
  .v5 .r-fc{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--s1);font-size:13px;text-align:left}
  .v5 .r-fc:hover{border-color:var(--line2);background:var(--s2)}
  .v5 .r-fc svg{width:16px;height:16px;color:var(--ink3)}
  .v5 .r-fc span{flex:1}
  .v5 .r-fc em{font:500 12px var(--mono);color:var(--ink4);font-style:normal}
  .v5 .r-fc.drop{border-color:var(--primary);background:var(--primary-a)}
  .v5 .r-sh{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--ink4);letter-spacing:.04em}
  .v5 .r-cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .v5 .r-cd{position:relative;display:flex;flex-direction:column;gap:8px;min-height:188px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--s1);text-align:left;cursor:pointer}
  .v5 .r-cd:hover{border-color:var(--line2);background:var(--s2)}
  .v5 .r-cd[aria-current=true]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
  .v5 .r-cd .r-ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--tone) 20%,transparent);color:var(--tone)}
  .v5 .r-cd .r-ic svg{width:15px;height:15px}
  .v5 .r-cd .r-tt{font-size:14px;font-weight:600;line-height:1.35;letter-spacing:-.2px}
  .v5 .r-cd .r-ex{font-size:12px;color:var(--ink3);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .v5 .r-cd .r-mt{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink4)}
  .v5 .r-cd .r-mt .d{font-family:var(--mono)}
  .v5 .r-cd .r-bd{position:absolute;right:12px;top:14px;display:flex;gap:4px}
  .v5 .r-cd .r-bd span{height:18px;padding:0 6px;border-radius:9px;font-size:12px;display:inline-flex;align-items:center}
  .v5 .r-cd .r-bd .r-t{background:var(--primary-a);color:var(--primary-h)}
  .v5 .r-cd .r-bd .r-g{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
  .v5 .r-cd.r-new{border-style:dashed;align-items:flex-start;justify-content:center;background:none;color:var(--ink3)}
  .v5 .r-cd.r-new:hover{color:var(--ink);border-color:var(--primary)}
  .v5 .r-cd.r-new b{font-size:14px;color:var(--ink)}
  .v5 .r-cd.r-new small{font-size:12px;line-height:1.5}
  .v5 .r-cd.r-new .r-ic{--tone:var(--primary-h)}
  .v5 .r-pk{position:absolute;top:0;right:0;bottom:0;width:min(560px,58%);background:var(--canvas);border-left:1px solid var(--line2);box-shadow:-24px 0 48px rgba(0,0,0,.55);display:flex;flex-direction:column;animation:pk .16s ease-out;z-index:5}
  .v5 .r-pk.r-full{width:100%;box-shadow:none;border-left:0;animation:none}
  @keyframes pk{from{transform:translateX(24px);opacity:0}}
  .v5 .pk-h{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-bottom:1px solid var(--line);flex:none}
  .v5 .pk-h .r-sp{flex:1}
  .v5 .pk-b{flex:1;overflow:auto}
  .v5 .pk-b .r-doc{padding:28px 32px 60px}

  /* ===== 링크 · 태그 (6~10 공통, 1~5 에서도 보임) ===== */
  .r-wl{color:var(--primary-h);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--primary-h) 40%,transparent);cursor:pointer}
  .r-wl:hover{background:var(--primary-a)}
  .r-wl::before{content:"↗";font-size:.8em;margin-right:1px;opacity:.7}
  .r-tag{display:inline-block;padding:0 5px;border-radius:4px;background:var(--s3);color:var(--ink3);font-size:.88em;line-height:1.5}
  .r-lp{position:fixed;z-index:60;width:260px;padding:4px;border:1px solid var(--line2);border-radius:8px;background:var(--s2);box-shadow:0 12px 32px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:1px}
  .r-lp p{margin:4px 8px;font-size:12px;color:var(--ink4)}
  .r-lp button{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;text-align:left;font-size:13px;color:var(--ink)}
  .r-lp button small{margin-left:auto;font:400 12px var(--mono);color:var(--ink4)}
  .r-lp button b{font-weight:500;font-size:12px;color:var(--ink4);width:22px}
  .r-lp button[aria-selected=true]{background:var(--s4)}
  .r-lp button svg{width:13px;height:13px;color:var(--ink4)}
  /* 찾기 창 */
  .r-cmd{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:14vh}
  .r-cmd>div{width:min(560px,92vw);border:1px solid var(--line2);border-radius:12px;background:var(--s2);box-shadow:0 24px 64px rgba(0,0,0,.6);overflow:hidden}
  .r-cmd label{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--line);color:var(--ink4)}
  .r-cmd input{flex:1;border:0;background:none;outline:0;font-size:16px;color:var(--ink)}
  .r-cmd ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
  .r-cmd li.h{padding:8px 10px 4px;font-size:12px;color:var(--ink4)}
  .r-cmd li button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;text-align:left;font-size:13px}
  .r-cmd li button svg{width:14px;height:14px;color:var(--ink4)}
  .r-cmd li button small{margin-left:auto;font:400 12px var(--mono);color:var(--ink4)}
  .r-cmd li button[aria-selected=true]{background:var(--s4)}
  .r-cmd .ft{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink4)}
  .r-kbd{font:500 12px var(--mono);padding:1px 5px;border:1px solid var(--line2);border-radius:4px;color:var(--ink3);background:var(--s1)}

  /* ===== 6. 노트 서랍 ===== */
  .v6{display:grid;grid-template-columns:236px minmax(0,1fr) 264px;height:100%}
  .v6 .r-ex6{border-right:1px solid var(--line);overflow:auto;padding:10px 8px 40px;background:var(--canvas)}
  .v6 .r-xh{display:flex;align-items:center;gap:2px;padding:0 4px 8px}
  .v6 .r-xh b{flex:1;font-size:12px;font-weight:600;color:var(--ink4);letter-spacing:.04em}
  .v6 .r-xh .ibtn{width:24px;height:24px}
  .v6 .r-fg>button{display:flex;align-items:center;gap:6px;width:100%;height:26px;padding:0 6px;border-radius:5px;font-size:13px;color:var(--ink2);font-weight:500}
  .v6 .r-fg>button:hover{background:var(--s2)}
  .v6 .r-fg>button .cv{width:10px;color:var(--ink4);transition:transform .12s;display:inline-block}
  .v6 .r-fg.shut>button .cv{transform:rotate(-90deg)}
  .v6 .r-fg.shut .r-fk{display:none}
  .v6 .r-fg>button em{margin-left:auto;font:400 12px var(--mono);color:var(--ink4);font-style:normal}
  .v6 .r-fk{margin-left:11px;padding-left:6px;border-left:1px solid var(--line)}
  .v6 .r-fi{display:flex;align-items:center;gap:7px;width:100%;height:26px;padding:0 6px;border-radius:5px;font-size:13px;color:var(--ink3);text-align:left;white-space:nowrap;overflow:hidden}
  .v6 .r-fi:hover{background:var(--s2);color:var(--ink)}
  .v6 .r-fi[aria-current=true]{background:var(--s3);color:var(--ink)}
  .v6 .r-fi .d{font:500 12px var(--mono);color:var(--ink4);flex:none}
  .v6 .r-fi span{overflow:hidden;text-overflow:ellipsis}
  .v6 .r-fi svg{width:12px;height:12px;flex:none;color:var(--ink4)}
  .v6 .r-fi.dim{opacity:.35}
  .v6 .r-tg6{display:flex;flex-wrap:wrap;gap:4px;padding:4px 4px 0}
  .v6 .r-tg6 button{height:22px;padding:0 7px;border-radius:4px;background:var(--s2);font-size:12px;color:var(--ink3)}
  .v6 .r-tg6 button em{font:400 12px var(--mono);color:var(--ink4);font-style:normal;margin-left:3px}
  .v6 .r-tg6 button[aria-pressed=true]{background:var(--primary-a);color:var(--primary-h)}
  .v6 .r-mid{display:flex;flex-direction:column;min-width:0;min-height:0}
  .v6 .r-tabs{display:flex;align-items:flex-end;gap:2px;height:38px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--s1);flex:none;overflow-x:auto}
  .r-tabs .r-tab{display:flex;align-items:center;height:30px;max-width:200px;border-radius:7px 7px 0 0;color:var(--ink3);font-size:13px;border:1px solid transparent;border-bottom:0;position:relative;top:1px}
  .r-tabs .r-tab:hover{background:var(--s2)}
  .r-tabs .r-tab[aria-selected=true]{background:var(--canvas);border-color:var(--line);color:var(--ink)}
  .r-tabs .r-tab>button:first-child{display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;height:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r-tabs .r-tab>button:first-child svg{width:12px;height:12px;color:var(--ink4);flex:none}
  .r-tabs .r-tab .x{width:18px;height:18px;margin-right:5px;border-radius:4px;display:grid;place-items:center;color:var(--ink4);flex:none}
  .r-tabs .r-tab .x:hover{background:var(--s4);color:var(--ink)}
  .r-tabs .r-tab .x svg{width:10px;height:10px}
  .r-tabs .r-tnew{width:26px;height:26px;margin:0 0 4px 2px;border-radius:5px;display:grid;place-items:center;color:var(--ink4)}
  .r-tabs .r-tnew:hover{background:var(--s3);color:var(--ink)}
  .r-tabs .r-tnew svg{width:13px;height:13px}
  .v6 .r-ed6{flex:1;overflow:auto}
  .r-prop{margin:0 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:2px 10px;font-size:13px}
  .r-prop dt{display:flex;align-items:center;gap:6px;height:28px;color:var(--ink4)}
  .r-prop dt svg{width:13px;height:13px}
  .r-prop dd{margin:0;display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-height:28px;color:var(--ink2)}
  .r-prop dd .r-fold{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;border-radius:4px;color:var(--ink2)}
  .r-prop dd .r-fold:hover{background:var(--s3)}
  .r-prop dd input{width:90px;height:22px;border:0;background:none;outline:0;font-size:12px;color:var(--ink)}
  .r-prop dd input::placeholder{color:var(--ink4)}
  .r-prop dd .r-tag button{margin-left:3px;color:var(--ink4)}
  .r-prop dd .r-tag button:hover{color:var(--ink)}
  .v6 .r-stat{display:flex;align-items:center;gap:14px;height:26px;padding:0 14px;border-top:1px solid var(--line);font:400 12px var(--mono);color:var(--ink4);flex:none;background:var(--s1)}
  .v6 .r-stat span:last-child{margin-left:auto}
  .v6 .r-cx{border-left:1px solid var(--line);overflow:auto;padding:14px 12px 40px;background:var(--s1);display:flex;flex-direction:column;gap:18px}
  .v6 .r-cx h4{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:12px;font-weight:600;color:var(--ink4);letter-spacing:.04em}
  .v6 .r-cx h4 em{font:400 12px var(--mono);font-style:normal}
  .v6 .r-bl{display:block;width:100%;padding:8px 10px;margin-bottom:6px;border-radius:7px;border:1px solid var(--line);background:var(--canvas);text-align:left}
  .v6 .r-bl:hover{border-color:var(--line2)}
  .v6 .r-bl b{display:block;font-size:13px;font-weight:500;color:var(--ink);margin-bottom:3px}
  .v6 .r-bl>span{display:block;font-size:12px;line-height:1.5;color:var(--ink3)}
  .v6 .r-bl mark{background:var(--primary-a);color:var(--primary-h);border-radius:3px;padding:0 2px}
  .v6 .r-bl .r-bt{margin-top:6px;height:22px;font-size:12px;padding:0 7px}
  .v6 .r-ol a{display:block;padding:3px 8px;font-size:12px;color:var(--ink3);border-left:1px solid var(--line)}
  .v6 .r-ol a:hover{color:var(--ink);border-color:var(--primary)}

  /* ===== 7. 블록 + 슬래시 ===== */
  .v7{display:flex;flex-direction:column;height:100%}
  .v7 .r-cr{display:flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-bottom:1px solid var(--line);flex:none;font-size:13px;color:var(--ink3)}
  .v7 .r-cr b{color:var(--ink);font-weight:500}
  .v7 .r-cr .ibtn{width:26px;height:26px}
  .v7 .r-cr .r-sp{flex:1}
  .v7 .r-pg{flex:1;overflow:auto;position:relative}
  .v7 .r-doc{max-width:760px;padding:40px 72px 160px}
  .v7 .r-dh{display:flex;align-items:baseline;gap:12px;font-size:13px;color:var(--ink4)}
  .v7 .r-dh .big{font-size:13px;font-weight:600;color:var(--primary-h)}
  .v7 .r-dh .st{display:flex;gap:12px;margin-left:auto}
  .v7 .r-tpl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .v7 .r-tpl button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:178px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--s1);text-align:left;font-size:13px;color:var(--ink)}
  .v7 .r-tpl button small{font-size:12px;color:var(--ink4);line-height:1.45}
  .v7 .r-tpl button:hover{border-color:var(--primary);background:var(--s2)}
  .v7 .doc-b>*{position:relative}
  .v7 .doc-b blockquote{margin:6px 0 10px;padding:2px 0 2px 14px;border-left:3px solid var(--line2);color:var(--ink3)}
  .doc-b hr{border:0;border-top:1px solid var(--line2);margin:18px 0}
  .doc-b .r-call{display:flex;gap:10px;margin:8px 0 12px;padding:10px 12px;border-radius:8px;background:var(--s2);border:1px solid var(--line)}
  .doc-b .r-call::before{content:"!";flex:none;width:18px;height:18px;border-radius:50%;background:var(--warn);color:#111;font:700 12px/18px var(--mono);text-align:center;margin-top:3px}
  .doc-b ul.r-todo{list-style:none;padding-left:2px}
  .doc-b ul.r-todo li{display:flex;gap:8px;align-items:baseline}
  .doc-b ul.r-todo li::before{content:"";flex:none;width:13px;height:13px;border:1.5px solid var(--ink4);border-radius:3px;transform:translateY(2px)}
  .doc-b ul.r-todo li.on{color:var(--ink4);text-decoration:line-through}
  .doc-b ul.r-todo li.on::before{background:var(--done);border-color:var(--done)}
  .doc-b .r-emb{margin:8px 0 14px;border:1px solid var(--line);border-radius:8px;background:var(--s1);padding:8px 6px 6px;user-select:none}
  .doc-b .r-emb .eh{display:flex;align-items:center;gap:6px;padding:0 6px 4px;font-size:12px;color:var(--ink4)}
  .doc-b .r-emb .eh i{font-style:normal;margin-left:auto;font-family:var(--mono)}
  .doc-b .r-emb .r-mr{font-size:13px;min-height:26px}
  .doc-b .r-q{margin:22px 0 4px;font-size:13px;color:var(--primary-h);font-weight:500}
  .r-bh{position:absolute;z-index:4;display:none;gap:1px}
  .r-bh button{width:20px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--ink4)}
  .r-bh button:hover{background:var(--s3);color:var(--ink)}
  .r-bh button svg{width:13px;height:13px}
  .r-bh .gr{cursor:grab;font:700 12px/1 var(--mono);letter-spacing:-2px}
  .r-sm{position:fixed;z-index:60;width:280px;max-height:340px;overflow:auto;padding:4px;border:1px solid var(--line2);border-radius:9px;background:var(--s2);box-shadow:0 12px 32px rgba(0,0,0,.55)}
  .r-sm p{margin:6px 8px 3px;font-size:12px;color:var(--ink4)}
  .r-sm button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:6px;text-align:left;font-size:13px;color:var(--ink)}
  .r-sm button i{flex:none;width:26px;height:26px;border-radius:6px;border:1px solid var(--line2);background:var(--s1);display:grid;place-items:center;font:600 12px var(--mono);font-style:normal;color:var(--ink3)}
  .r-sm button i svg{width:13px;height:13px}
  .r-sm button span{display:flex;flex-direction:column}
  .r-sm button small{font-size:12px;color:var(--ink4)}
  .r-sm button[aria-selected=true]{background:var(--s4)}

  /* ===== 8. 나란히 보기 ===== */
  .v8{display:grid;grid-template-columns:var(--lw,1fr) 6px var(--rw,1fr);height:100%}
  .v8.one{grid-template-columns:1fr 0 0}
  .v8 .r-pn{display:flex;flex-direction:column;min-width:0;min-height:0}
  .v8 .r-pn.foc .r-tabs{box-shadow:inset 0 -2px 0 -0px var(--primary)}
  .v8 .r-tabs{display:flex;align-items:flex-end;gap:2px;height:38px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--s1);flex:none}
  .v8 .r-pa{margin-left:auto;display:flex;gap:2px;align-self:center}
  .v8 .r-pa .ibtn{width:26px;height:26px}

    if (g('data-kai')) {

  document.addEventListener('input', (e) => {

  /* ---------- 6~10 이벤트 ---------- */
  function handle6(e, g) {

    if ((el = g('data-bmi'))) { bmDo(el.dataset.bmi); return true; }
    if (SM && SM.menu && !g('data-bmenu')) smHide();
    if ((el = g('data-ropen'))) { openEntry(el.dataset.ropen); render(); return true; }
    if ((el = g('data-day'))) { A.s.date = el.dataset.day; openEntry(ensureDay(el.dataset.day).id); render(); return true; }

    if ((el = g('data-tclose'))) { const id = el.dataset.tclose, i = S.tabs.indexOf(id); S.tabs.splice(i, 1); if (S.cur === id) S.cur = S.tabs[Math.min(i, S.tabs.length - 1)] || 'd1103'; render(); return true; }
    if ((el = g('data-tab'))) { openEntry(el.dataset.tab); render(); return true; }
    if ((el = g('data-shut'))) { S.shut[el.dataset.shut] = !S.shut[el.dataset.shut]; render(); return true; }
    if ((el = g('data-tagf'))) { S.tag6 = el.dataset.tagf || null; render(); return true; }
    if ((el = g('data-tagdel'))) { const x = find(el.closest('[data-doc]').dataset.doc); x.tags = (x.tags || []).filter((t) => t !== el.dataset.tagdel); render(); return true; }
    /* 7 */
    if ((el = g('data-tpl'))) {
      const x = find(S.b7); x.html = TPL[+el.dataset.tpl][2](x.date); x.synced = false; A.retro.add(x.date); render();
      const f = [...$('.r-blk').querySelectorAll('p,li')].find((n) => !n.closest('.r-emb') && !n.classList.contains('r-q') && !n.textContent.trim()); f && caretIn(f); return true;
    }
    if ((el = g('data-b7step'))) { const d = A.add(find(S.b7).date, +el.dataset.b7step); if (d <= A.TODAY) { S.b7 = ensureDay(d).id; render(); } return true; }
    if (g('data-badd')) { if (HB) { const p = document.createElement('p'); p.textContent = '/'; HB.after(p); caretIn(p); smCheck(p.parentElement); } return true; }
    if (g('data-bmenu')) { if (SM && SM.menu) smHide(); else bmDraw(); return true; }
    if ((el = e.target.closest('.doc-b ul.r-todo li')) && e.target === el && e.offsetX < 20) { el.classList.toggle('on'); fire(el.closest('.doc-b')); return true; }
    /* 8 */
    if ((el = g('data-tclose8'))) {
      const [i, id] = el.dataset.tclose8.split(':'), p = S.panes[+i]; p.tabs = p.tabs.filter((t) => t !== id); if (p.cur === id) p.cur = p.tabs[p.tabs.length - 1];
      if (!p.tabs.length) { if (+i === 1) S.one = true; else if (!S.one) { S.panes = [S.panes[1], { tabs: [], cur: null }]; S.one = true; } else { p.tabs = ['d1103']; p.cur = 'd1103'; } S.fp = 0; }
      render(); return true;
    }
    if ((el = g('data-tab8'))) { const [i, id] = el.dataset.tab8.split(':'); S.panes[+i].cur = id; S.fp = +i; render(); return true; }
    if ((el = g('data-day8'))) { openEntry(ensureDay(el.dataset.day8).id, { pane: 1 }); S.fp = 1; render(); return true; }
    if (g('data-swap')) { S.panes.reverse(); render(); return true; }
    if (g('data-pclose8')) { S.one = true; S.fp = 0; render(); return true; }
    if (g('data-split')) { S.one = false; const p = S.panes[1]; if (!p.tabs.length) { p.tabs = ['d1102']; p.cur = 'd1102'; } S.fp = 1; render(); return true; }
    if (g('data-qb')) { quote(); return true; }
    /* 9 */
    if ((el = g('data-t9'))) { S.t9 = el.dataset.t9; S.e9 = null; render(); return true; }
    if ((el = g('data-e9'))) { S.e9 = el.dataset.e9; render(); return true; }
    if ((el = g('data-dg9'))) { const t = el.dataset.dg9; S.dg[t] = 'pending'; render(); setTimeout(() => { S.dg[t] = 'done'; A.toast(`#${t} 주제 정리를 새로 만들었어요`); render(); }, 1600); return true; }
    /* 10 */
    if (g('data-zen')) { S.zen = !S.zen; render(); return true; }
    if (g('data-dim')) { S.dim = !S.dim; render(); return true; }
    if (g('data-timer')) { timer(); render(); return true; }
    if (g('data-ask')) { S.ask = !S.ask; render(); return true; }
    if (g('data-asknext')) { S.q10 = (S.q10 + 1) % QS.length; render(); return true; }
    if (g('data-askuse')) { const q = QS[S.q10]; S.ask = false; S.q10 = (S.q10 + 1) % QS.length; render(); appendBlock($('.v10 .doc-b'), `<h2>${q}</h2><p><br></p>`); return true; }
    if (g('data-drw')) { S.drw = !S.drw; render(); return true; }
    if ((el = g('data-ins'))) { appendBlock($('.v10 .doc-b'), `<li>${A.esc(el.dataset.ins)}</li>`); return true; }
    return false;
  }
  function input6(t, x) {
    if (RV < 6) return;
    lpCheck(t); if (RV === 7) smCheck(t);
    if (RV === 6) { $('#cx6').innerHTML = cx6(x); $('#st6').innerHTML = stat6(x); }
    if (RV === 10) {
      $('#cn10').textContent = charN(x); $('#rg10').innerHTML = ring(x);
      const d = $('#dock'); d.classList.add('quiet'); clearTimeout(input6.t); input6.t = setTimeout(() => d.classList.remove('quiet'), 1600);
      const s = getSelection(); if (s.rangeCount) { const r = s.getRangeAt(0).getBoundingClientRect(), z = $('#z10'), zr = z.getBoundingClientRect(); if (r.height) { const dy = r.top - zr.top - z.clientHeight * 0.42; if (Math.abs(dy) > 24) z.scrollBy({ top: dy, behavior: 'smooth' }); } }
    }
  }
  let QB = null;
  function quote() {
    const q = QB; const b = $('#qb'); b && b.remove(); QB = null; if (!q || S.one) return;
    const ti = 1 - q.pane, tgt = find(S.panes[ti].cur), src = find(q.src); if (!tgt) return;
    if (tgt.ai) { A.toast('AI 요약에는 인용을 넣을 수 없어요'); return; }
    tgt.html = (tgt.html || '') + `<blockquote>${A.esc(q.text)} — <a class="r-wl" data-wl="${src.id}" href="#">${A.esc(titleOf(src))}</a></blockquote>`;
    tgt.synced = false; getSelection().removeAllRanges(); A.toast(`"${titleOf(tgt)}" 끝에 인용으로 넣었어요`); render();
    const pb = document.querySelector(`[data-pane="${ti}"] .r-pb`); pb && (pb.scrollTop = pb.scrollHeight);
  }
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (RV < 6) { if (e.target.isContentEditable && !e.ctrlKey && !e.metaKey) e.stopPropagation(); return; }
    if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === 'k') { e.preventDefault(); e.stopPropagation(); CP ? cpClose() : cpOpen(); return; }
    const nav = (st, draw, pick, hide) => {
      if (k === 'ArrowDown' || k === 'ArrowUp') { st.k = (st.k + (k === 'ArrowDown' ? 1 : -1) + st.items.length) % Math.max(1, st.items.length); draw(); }
      else if (k === 'Enter' || (k === 'Tab' && st !== CP)) pick(st.k); else if (k === 'Escape') hide(); else return false;
      e.preventDefault(); e.stopPropagation(); return true;
    };
    if (CP) { if (!nav(CP, cpDraw, cpPick, cpClose)) e.stopPropagation(); return; }
    if (LP && LP.items.length && nav(LP, () => lpDraw(), lpPick, lpHide)) return;
    if (LP && k === 'Escape') { lpHide(); e.stopPropagation(); return; }
    if (SM && !SM.menu && SM.items.length && nav(SM, () => smDraw(), smPick, smHide)) return;
    if (SM && k === 'Escape') { smHide(); e.stopPropagation(); return; }
    if (k === 'Escape' && RV === 10 && S.zen) { S.zen = false; render(); e.stopPropagation(); return; }
    if (e.target.isContentEditable && !e.ctrlKey && !e.metaKey) e.stopPropagation();
    if (k === 'Enter' && e.target.matches('[data-tagadd]') && e.target.value.trim()) {
      const x = find(e.target.dataset.tagadd), v = e.target.value.trim().replace(/^#/, ''); x.tags = [...new Set([...(x.tags || []), v])]; A.toast(`#${v} 태그를 달았어요`); render(); const n = $('[data-tagadd]'); n && n.focus();
    }
  }, true);
  document.addEventListener('focusin', (e) => { const t = e.target; if (t.matches && t.matches('.r-blk') && !t.innerHTML.trim()) { t.innerHTML = '<p><br></p>'; caretIn(t.firstChild); } });
  document.addEventListener('mousedown', (e) => {
    if (!(e.target instanceof Element)) return;
    if (e.target.closest('#lp, #sm, #qb')) { e.preventDefault(); return; }
    if (LP && !e.target.closest('#lp')) lpHide();
    if (RV !== 8) return;
    const pn = e.target.closest('[data-pane]');
    if (pn && S.fp !== +pn.dataset.pane) { S.fp = +pn.dataset.pane; document.querySelectorAll('.r-pn').forEach((x) => x.classList.toggle('foc', x === pn)); }
    if (e.target.closest('[data-dv]') && !S.one) {
      e.preventDefault(); const v = $('.v8'), x0 = v.getBoundingClientRect().left, dv = e.target; dv.classList.add('on');
      const mv = (ev) => { S.lw = Math.max(280, Math.min(ev.clientX - x0, v.clientWidth - 280)); v.style.setProperty('--lw', S.lw + 'px'); };
      const up = () => { dv.classList.remove('on'); removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
      addEventListener('mousemove', mv); addEventListener('mouseup', up);
    }
  }, true);
  document.addEventListener('mouseup', (e) => {
    if (RV !== 8 || !(e.target instanceof Element) || e.target.closest('#qb')) return;
    setTimeout(() => {
      const s = getSelection(), old = $('#qb'); old && old.remove(); QB = null;
      if (!s.rangeCount || s.isCollapsed || S.one) return;
      const r = s.getRangeAt(0), n = r.commonAncestorContainer, el = n.nodeType === 3 ? n.parentElement : n, pn = el.closest('[data-pane]'), t = s.toString().trim();
      if (!pn || !t || !el.closest('.doc-b')) return;
      const i = +pn.dataset.pane, rc = r.getBoundingClientRect();
      QB = { pane: i, src: S.panes[i].cur, text: t.slice(0, 280) };
      document.body.insertAdjacentHTML('beforeend', `<button class="r-qb" id="qb" data-qb style="left:${Math.max(8, Math.min(rc.right - 40, innerWidth - 230))}px;top:${Math.min(rc.bottom + 6, innerHeight - 40)}px">${i ? '←' : '→'} ${i ? '왼쪽' : '오른쪽'} 글에 인용으로 넣기</button>`);
    }, 0);
  });
  document.addEventListener('mousemove', (e) => {
    if (RV !== 7 || (SM && SM.menu) || DRAGB || !(e.target instanceof Element)) return;
    const pg = $('#pg7'), body = $('.r-blk'), bh = $('#bh'); if (!pg || !body || e.target.closest('#bh')) return;
    const br = body.getBoundingClientRect();
    const b = e.clientX > br.left - 64 && e.clientX < br.right + 20 ? [...body.children].find((c) => { const r = c.getBoundingClientRect(); return e.clientY >= r.top - 4 && e.clientY <= r.bottom + 4; }) : null;
    if (!b) { bh.style.display = 'none'; return; }
    HB = b; const pr = pg.getBoundingClientRect(), r = b.getBoundingClientRect();
    bh.style.display = 'flex'; bh.style.left = (br.left - pr.left - 48) + 'px'; bh.style.top = (r.top - pr.top + pg.scrollTop + (b.tagName === 'H2' ? 2 : 1)) + 'px';
  });
  document.addEventListener('dragstart', (e) => { if (RV === 7 && e.target.closest && e.target.closest('[data-bmenu]') && HB) { DRAGB = HB; e.dataTransfer.setData('text/blk', '1'); e.dataTransfer.effectAllowed = 'move'; smHide(); } });
  const dropAt = (e) => { const body = $('.r-blk'); if (!body) return null; const b = [...body.children].find((c) => { const r = c.getBoundingClientRect(); return e.clientY >= r.top - 4 && e.clientY <= r.bottom + 4; }); if (!b) return null; const r = b.getBoundingClientRect(); return { b, after: e.clientY > r.top + r.height / 2 }; };
  document.addEventListener('dragover', (e) => {
    if (!DRAGB) return; e.preventDefault(); document.querySelectorAll('.dropb,.dropa').forEach((x) => x.classList.remove('dropb', 'dropa'));
    const t = dropAt(e); t && t.b !== DRAGB && t.b.classList.add(t.after ? 'dropa' : 'dropb');
  });
  document.addEventListener('drop', (e) => {
    if (!DRAGB) return; e.preventDefault(); e.stopPropagation(); const t = dropAt(e), body = DRAGB.parentElement;
    if (t && t.b !== DRAGB) { t.after ? t.b.after(DRAGB) : t.b.before(DRAGB); A.toast('블록을 옮겼어요'); }
    document.querySelectorAll('.dropb,.dropa').forEach((x) => x.classList.remove('dropb', 'dropa')); DRAGB = null; fire(body);
  }, true);
  document.addEventListener('dragend', () => { DRAGB = null; document.querySelectorAll('.dropb,.dropa').forEach((x) => x.classList.remove('dropb', 'dropa')); });
  document.addEventListener('selectionchange', () => {
    if (RV !== 10) return; const body = $('.v10 .doc-b'); if (!body) return; const s = getSelection();
    const b = s.rangeCount ? topBlock(body, s.anchorNode) : null;
    body.querySelectorAll(':scope > .cur').forEach((x) => x !== b && x.classList.remove('cur')); b && b.classList.add('cur');
  });
  document.addEventListener('mouseover', (e) => {
    if (RV !== 9) return; document.querySelectorAll('.v9 .hl').forEach((x) => x.classList.remove('hl'));
    const d = e.target.closest && e.target.closest('.r-tr [data-e9]'); if (!d) return; const id = d.dataset.e9;
    document.querySelectorAll(`.v9 .r-tr [data-e9="${id}"], .v9 path[data-a="${id}"], .v9 path[data-b="${id}"]`).forEach((x) => x.classList.add('hl'));
  });
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}

  $('#app').insertAdjacentHTML('afterbegin', P.shell('retro'));
  A.s.date = Q.get('date') || (RV === 4 ? A.TODAY : '2026-11-02');
  if (Q.get('entry')) { const x = find(Q.get('entry')); if (x) { S.type = x.type; if (RV === 5) S.peek = x.id; } }
  A.init(render);
  render();
