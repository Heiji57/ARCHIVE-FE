<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVE 시안 A · 레일 + 일간</title>
<meta name="description" content="좌측 레일, 일간 시간선 중심, 배치 대기, 실제 활동 트랙, 하루 닫기">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<style>
  .app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh}
  .app.has-panel{grid-template-columns:248px minmax(0,1fr) 360px}
  .rail{background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding:12px;overflow:auto}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.14em;font-size:12px;padding:4px 6px}
  .brand i{width:18px;height:18px;border-radius:5px;background:var(--primary);display:inline-block}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:var(--r);color:var(--ink3)}
  .nav a:hover{background:var(--s3);color:var(--ink)}
  .nav a[aria-current=page]{background:var(--s4);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .rail h2{margin:0 0 6px;padding:0 6px;font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.04em;display:flex;justify-content:space-between}
  .q{display:flex;flex-direction:column;gap:4px}
  .qi{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--ink2);cursor:grab;text-align:left;font-size:13px}
  .qi:hover{background:var(--s3);border-style:solid}
  .qi[aria-current=true]{border-color:var(--primary);border-style:solid}
  .qhint{font-size:12px;color:var(--ink4);padding:0 6px}
  .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3);padding:6px 8px;border:1px solid var(--line);border-radius:var(--r)}
  .sync b{width:6px;height:6px;border-radius:50%;background:var(--done)}
  .me{display:flex;align-items:center;gap:8px;padding:2px 4px}
  .av{width:24px;height:24px;border-radius:50%;background:var(--s4);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px}
  main{display:flex;flex-direction:column;min-width:0;height:100vh}
  .top{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
  .top .cap{flex:1;max-width:560px}
  .hd{display:flex;align-items:flex-end;gap:16px;padding:14px 16px 10px;flex-wrap:wrap}
  .hd .big{font:600 44px/1 var(--mono);letter-spacing:-2px}
  .hd .big.today{color:var(--primary-h)}
  .hd h1{margin:0;font-size:16px;font-weight:500;color:var(--ink2);line-height:1.3}
  .hd h1 small{display:block;color:var(--ink3);font-size:12px;font-weight:400}
  .hd .sp{flex:1}
  .hd .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .scroll{flex:1;overflow:auto;min-height:0}
  aside.panel{border-left:1px solid var(--line);background:var(--s1);overflow:auto}
  @media (max-width:900px){
    .app,.app.has-panel{grid-template-columns:1fr}
    .rail{display:none}
    aside.panel{position:fixed;inset:0;z-index:30}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" aria-label="사이드바">
    <div class="brand"><i></i>A.R.C.H.I.V.E</div>
    <nav class="nav" aria-label="주 메뉴">
      <a href="#"><i data-ico="dash"></i>대시보드</a>
      <a href="#" aria-current="page"><i data-ico="cal"></i>캘린더</a>
      <a href="#"><i data-ico="todo"></i>할 일</a>
      <a href="#"><i data-ico="retro"></i>회고</a>
      <a href="#"><i data-ico="set"></i>설정</a>
    </nav>
    <section aria-label="미니 달력" id="mini"></section>
    <section aria-label="배치 대기"><h2><span>배치 대기</span><span class="num" id="qn"></span></h2><div class="q" id="queue"></div><p class="qhint">시간선으로 끌어다 놓으면 배치돼요</p></section>
    <div class="foot">
      <div class="sync"><b></b>GitHub 저장소 3개 연결</div>
      <div class="me"><span class="av">D</span><span style="flex:1;font-size:13px">developer</span><button class="ibtn" aria-label="알림 2개" data-act="palette" title="Ctrl+K"><i data-ico="search"></i></button></div>
    </div>
  </aside>
  <main>
    <div class="top">
      <form class="cap" data-capform><i data-ico="plus"></i><input data-capture placeholder="내일 3시 PR 리뷰 #work  (C)" aria-label="퀵 캡처"><span class="kbd">⏎</span></form>
      <button class="btn" data-act="palette">검색·명령 <span class="kbd">Ctrl K</span></button>
    </div>
    <div class="hd" id="hd"></div>
    <div class="scroll" id="view"></div>
    <div id="close"></div>
  </main>
  <aside class="panel" id="panel" aria-label="작업 상세" hidden></aside>
</div>
<script src="shared/shared.js"></script>
<script>
  const $ = (q) => document.querySelector(q);
  function render() {
    const A = ARC, s = A.s;
    $('#mini').innerHTML = A.miniHTML(s.date);
    const q = A.queue();
    $('#qn').textContent = q.length;
    $('#queue').innerHTML = q.map((t) => `<button class="qi" draggable="true" data-id="${t.id}" aria-current="${s.sel === t.id}">${A.sd(t.status)}${A.esc(t.title)}</button>`).join('') || '<p class="qhint">비어 있어요</p>';
    const d = A.s2d(s.date), st = A.stats(s.date), isT = s.date === A.TODAY;
    $('#hd').innerHTML = `<span class="big ${isT ? 'today' : ''} num">${s.view === 'month' ? d.getMonth() + 1 : d.getDate()}</span>
      <h1>${s.view === 'day' ? A.DOW[d.getDay()] + '요일' : A.title()}<small>${d.getFullYear()}년 ${d.getMonth() + 1}월${s.view === 'day' ? ` · 할 일 ${st.n}개 · 계획 ${st.plan.toFixed(1)}h · 커밋 ${st.commits}` : ''}</small></h1>
      <span class="sp"></span>
      <div class="ctl">
        <button class="btn" data-act="ghost" aria-pressed="${s.ghost}" title="G">실제 활동 ${s.ghost ? '켬' : '끔'}</button>
        <div class="seg" role="group" aria-label="보기">${[['month', '월'], ['week', '주'], ['day', '일']].map(([v, n]) => `<button data-view="${v}" aria-pressed="${s.view === v}">${n}</button>`).join('')}</div>
        <button class="ibtn" data-nav="-1" aria-label="이전">${A.ico.l}</button><button class="btn" data-nav="today">오늘</button><button class="ibtn" data-nav="1" aria-label="다음">${A.ico.r}</button>
      </div>`;
    const v = $('#view'), top = v.scrollTop; v.innerHTML = A.viewHTML(false);
    v.scrollTop = top || (s.view !== 'month' && !v.dataset.init ? (11 - A.H0) * A.HH - 20 : 0); v.dataset.init = 1;
    $('#close').innerHTML = s.view === 'day' ? A.closeBarHTML() : '';
    const t = A.byId(s.sel), p = $('#panel');
    p.hidden = !t; p.innerHTML = A.panelHTML(t); $('#app').classList.toggle('has-panel', !!t);
  }
  ARC.init(render);
</script>
</body>
</html>
