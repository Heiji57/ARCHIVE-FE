<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사이드바 시안</title>
<meta name="description" content="캘린더와 할 일 왼쪽 사이드바의 오늘 회고, 연동 문제, 그리고 하루 닫기의 내일로 이월을 다섯 가지씩 비교한다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<style>
  body{height:auto;min-height:100%}
  .wrap{padding:28px 24px 64px;max-width:1480px}
  h1{margin:0 0 6px;font-size:18px;font-weight:600}
  .lead{margin:0 0 20px;color:var(--ink3);font-size:13px;max-width:92ch;line-height:1.6}
  .tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;background:var(--canvas);border-bottom:1px solid var(--line);margin-bottom:20px}
  .tabs a{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--ink3)}
  .tabs a:hover{background:var(--s3);color:var(--ink)}
  section{margin:0 0 40px;scroll-margin-top:60px}
  .hd{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
  h2{margin:0;font-size:14px;font-weight:600;white-space:nowrap}
  h2 span{font-family:var(--mono);color:var(--ink4);font-weight:400;margin-right:8px}
  .hd p{margin:0;flex:1;font-size:12px;color:var(--ink3);line-height:1.5}
  .st{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
  .st button{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);font-size:12px;color:var(--ink3)}
  .st button:hover{background:var(--s3);color:var(--ink)}
  .st button[aria-pressed="true"]{border-color:var(--primary);color:var(--ink);background:var(--primary-a)}
  .st button:focus-visible{outline:2px solid var(--primary-h);outline-offset:2px}
  .st a{margin-left:auto;font-size:12px;color:var(--primary-h);align-self:center}
  iframe{display:block;width:100%;height:780px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}
</style>
</head>
<body>
<div class="wrap">
  <h1>사이드바 시안</h1>
  <p class="lead">캘린더와 할 일 화면이 같이 쓰는 왼쪽 사이드바입니다. 미니 달력, 캘린더, 태그 아래의 "오늘 회고"와 "연동 문제", 그리고 "오늘 회고 쓰기"를 누르면 열리는 하루 닫기 창의 "내일로 이월"을 각각 다섯 가지로 만들었습니다. 모두 눌러서 동작합니다.</p>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
</div>
<script>
  const C = 'd-calendar.html', T = 'd-todos.html';
  const L = [
    ['rd', '오늘 회고: 아직 안 쓴 상태', '5번 미니 달력에 붙이기로 정했습니다(기본). 사이드바 왼쪽 아래를 보세요. "쓰기"를 누르면 하루 닫기 창이 열리고, 저장하면 쓴 상태로 바뀝니다. 5번은 따로 섹션 없이 미니 달력 아래에 붙습니다.', [['1 한 줄', `${C}?rd=1`], ['2 진행 카드', `${C}?rd=2`], ['3 이번 주 줄', `${C}?rd=3`], ['4 초안 미리보기', `${C}?rd=4`], ['5 미니 달력에 붙이기', `${C}?rd=5`]], 'rd'],
    ['rdw', '오늘 회고: 쓴 뒤', '같은 다섯 가지의 오늘 회고를 쓴 뒤 모습입니다.', [['1 한 줄', `${C}?rd=1&rdw=1`], ['2 진행 카드', `${C}?rd=2&rdw=1`], ['3 이번 주 줄', `${C}?rd=3&rdw=1`], ['4 초안 미리보기', `${C}?rd=4&rdw=1`], ['5 미니 달력에 붙이기', `${C}?rd=5&rdw=1`]], 'rdw'],
    ['pb', '연동 문제', '3번 서비스 아이콘 + 바로 고치기로 정했습니다(기본). Google로 보내지 못한 할 일 1개, GitHub 이메일 권한 필요, 두 가지 문제가 있는 상태입니다. 문제가 없으면 모두 통째로 사라집니다. 2, 3, 5번은 "다시 보내기"로 사이드바에서 바로 고칠 수 있고, 권한은 설정의 연동 화면으로 갑니다.', [['1 목록', `${C}?pb=1`], ['2 접힌 한 줄', `${C}?pb=2`], ['3 서비스 아이콘 + 바로 고치기', `${C}?pb=3`], ['4 아래쪽 띠', `${C}?pb=4`], ['5 프로필 옆 배지', `${C}?pb=5`]], 'pb'],
    ['co', '하루 닫기: 내일로 이월', '"오늘 회고 쓰기"를 누르면 열리는 창입니다. 오늘 남은 할 일 3개를 어떻게 할지 정한 뒤 회고 초안으로 넘어갑니다. 체크 상자는 쓰지 않았습니다.', [['1 세 갈래 (내일, 다른 날, 두기)', `${C}?co=1&close=1`], ['2 한 장씩', `${C}?co=2&close=1`], ['3 두 칸 옮기기', `${C}?co=3&close=1`], ['4 날짜 줄', `${C}?co=4&close=1`], ['5 한 번에 + 하나씩', `${C}?co=5&close=1`]], 'co'],
    ['co2', '하루 닫기: 내일로 이월 (새 다섯 가지)', '위 다섯 가지와 다른 방식입니다. 6번은 내일 빈 시간까지 정하고, 10번은 넘기기와 회고 초안을 한 화면에서 끝냅니다.', [['6 내일 시간까지 잡기', `${C}?co=6&close=1`], ['7 대화로 묻기', `${C}?co=7&close=1`], ['8 고르기 + 내일 여유', `${C}?co=8&close=1`], ['9 골라서 한꺼번에', `${C}?co=9&close=1`], ['10 초안과 한 화면', `${C}?co=10&close=1`]], 'co2'],
    ['tm', '캘린더: 할 일 모달', '캘린더에서 할 일을 누르면 오른쪽 패널 대신 가운데 창으로 열립니다. "캘린더 드래그 버그 수정"을 연 상태이고, 다른 할 일을 눌러도 같은 창이 열립니다. "디자인 리뷰"는 Google로 보내지 못한 상태라 경고가 보입니다.', [['1 문서형 속성 목록', `${C}?tm=1&select=t3`], ['2 두 칸 (본문 + 속성)', `${C}?tm=2&select=t3`], ['3 작은 카드', `${C}?tm=3&select=t3`], ['4 상태 중심', `${C}?tm=4&select=t3`], ['5 문장형', `${C}?tm=5&select=t3`]], 'tm'],
    ['co4', '하루 닫기: 내일로 이월 (2 한 장씩에서 파생 16~20)', '모두 한 장씩 정하는 방식에, 고치기 쉬운 장치를 더했습니다. 정한 것은 되돌리기(⌫)로 바로 취소되고, 숫자 키 1~4로 고르며, 버튼마다 고르면 생기는 일(마감 지남 등)을 미리 보여 줍니다. 아직 안 정한 일이 있어도 "남은 일은 내일로 하고 초안 만들기"로 끝낼 수 있습니다.', [['16 앞뒤 이동 + 되돌리기', `${C}?co=16&close=1`], ['17 카드 + 정한 것 목록', `${C}?co=17&close=1`], ['18 추천 + 다른 날', `${C}?co=18&close=1`], ['19 쌓이는 카드', `${C}?co=19&close=1`], ['20 빠르게 넘기고 목록에서 고치기', `${C}?co=20&close=1`]], 'co4'],
    ['co3', '하루 닫기: 내일로 이월 (11~15)', '넘길 때 생기는 일까지 보여 주는 다섯 가지입니다. "i18n 문구 점검"은 마감이 내일, "일일 회고 작성"은 매일 반복, "캘린더 드래그 버그 수정"은 Google Calendar에 연결된 상태입니다.', [['11 영향 미리보기', `${C}?co=11&close=1`], ['12 오늘, 내일 타임라인', `${C}?co=12&close=1`], ['13 내일 꼭 할 일 3개', `${C}?co=13&close=1`], ['14 키보드로 정하기', `${C}?co=14&close=1`], ['15 못 끝낸 이유 함께', `${C}?co=15&close=1`]], 'co3'],
    ['tm2', '캘린더: 할 일 모달 (1 문서형에서 파생 6~10)', '1번 문서형 속성 목록을 바탕으로 했습니다. "i18n 문구 점검"을 연 상태이고 마감일 줄이 새로 들어갔습니다.', [['6 값만 보이고 누르면 펼침', `${C}?tm=6&select=t4`], ['7 묶음 접기 (언제, 분류, 연동)', `${C}?tm=7&select=t4`], ['8 속성 칩 줄', `${C}?tm=8&select=t4`], ['9 두 열 속성', `${C}?tm=9&select=t4`], ['10 빈 속성 숨기고 추가', `${C}?tm=10&select=t4`]], 'tm2'],
    ['td', '할 일 화면: 할 일 상세 창', '할 일 화면에서 할 일을 누르면 여는 창입니다. "i18n 문구 점검"(마감 내일)을 연 상태이고, 4번은 반복 할 일 "영어 스터디"를 열었습니다. 들어가는 요소는 실제 앱 상세 패널과 같습니다: 제목, 상태, 메모, 태그, 날짜, 마감일, 시간, 반복과 고칠 범위, Google Calendar, 삭제, 그리고 캘린더 고르기.', [['1 오른쪽 서랍 (위아래로 다음 할 일)', `${T}?td=1&select=t4`], ['2 넓은 문서 + 기록', `${T}?td=2&select=t4`], ['3 마감 중심', `${T}?td=3&select=t4`], ['4 반복 범위 먼저', `${T}?td=4&select=t14`], ['5 단축키 목록', `${T}?td=5&select=t4`]], 'td'],
  ];
  const $ = (q) => document.querySelector(q);
  $('#tabs').innerHTML = L.map(([k, t]) => `<a href="#v${k}">${t.split(' (')[0].split(':')[0]}</a>`).join('');
  $('#list').innerHTML = L.map(([k, t, d, st, pv]) => `<section id="v${k}"><div class="hd"><h2>${t}</h2><p>${d}</p></div>
    <div class="st" role="group" aria-label="${t}">${st.length > 1 ? st.map(([l, u], i) => `<button type="button" data-k="${k}" data-u="${u}" aria-pressed="${i === 0}">${l}</button>`).join('') : ''}${k === 'um' ? '' : `<a id="a${k}" href="${st[0][1].replace(/&open=[^#]*/, '')}" target="_blank" rel="noopener">이걸로 보기</a>`}</div>
    <iframe id="f${k}" title="${t}" loading="lazy" src="${st[0][1]}"></iframe></section>`).join('');
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.st button'); if (!b) return;
    b.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    const f = $('#f' + b.dataset.k), u = b.dataset.u, a = $('#a' + b.dataset.k); if (a) a.href = u.replace(/&open=[^#]*/, '');
    f.src = 'about:blank'; setTimeout(() => { f.src = u; }, 30);
  });
</script>
</body>
</html>
