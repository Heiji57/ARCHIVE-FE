<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오른쪽 패널 시안</title>
<meta name="description" content="캘린더와 할 일 화면이 같이 쓰는 오른쪽 패널 다섯 가지와 AI 작업 추천을 비교한다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="shared/shared.css">
<style>
  /* Hallmark · scope: app screen (시안 비교 페이지) · genre: atmospheric · theme: project tokens (ARCHIVE dark, shared.css) · signature: 버튼으로 시안을 바꿔 끼우는 실제 화면 · states: 8 · mode: fast · v2.0.0 */
  /* critique: a gallery of screenshots hides behaviour; each slot is the live page so the carry-over and the modal can be clicked through. */
  body{height:auto;min-height:100%}
  .wrap{padding:28px 24px 64px;max-width:1480px}
  h1{margin:0 0 6px;font-size:18px;font-weight:600;text-wrap:balance}
  .lead{margin:0 0 20px;color:var(--ink3);font-size:13px;max-width:92ch;line-height:1.6}
  .tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;flex-wrap:wrap;padding:10px 0;background:var(--canvas);border-bottom:1px solid var(--line);margin-bottom:20px}
  .tabs a{padding:5px 10px;border-radius:6px;font-size:13px;color:var(--ink3)}
  .tabs a:hover{background:var(--s3);color:var(--ink)}
  section{margin:0 0 40px;scroll-margin-top:60px}
  .hd{display:flex;align-items:baseline;gap:12px;margin:0 0 8px}
  h2{margin:0;font-size:14px;font-weight:600;white-space:nowrap}
  h2 span{font-family:var(--mono);color:var(--ink4);font-weight:400;margin-right:8px}
  .hd p{margin:0;flex:1;font-size:12px;color:var(--ink3);line-height:1.5}
  .st{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 8px}
  .st button{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);font-size:12px;color:var(--ink3)}
  .st button:hover{background:var(--s3);color:var(--ink)}
  .st button[aria-pressed="true"]{border-color:var(--primary);color:var(--ink);background:var(--primary-a)}
  .st button:focus-visible{outline:2px solid var(--primary-h);outline-offset:2px}
  .st a{margin-left:auto;font-size:12px;color:var(--primary-h);align-self:center}
  iframe:focus,iframe:focus-visible,iframe.kf{outline:2px solid var(--primary-h);outline-offset:2px}
  @media (max-width:640px){.hd{flex-direction:column;gap:4px}h2{white-space:normal}.wrap{padding:20px 16px 48px}}
  iframe{display:block;width:100%;height:780px;border:1px solid var(--line);border-radius:10px;background:var(--canvas)}
</style>
</head>
<body>
<div class="wrap">
  <h1>오른쪽 패널</h1>
  <p class="lead">하루 진행, 시간 미정 할 일, 마감 임박·지난 할 일, 그날 커밋, AI 작업 추천을 넣었습니다. 할 일 화면에는 그날 시간표가 하나 더 들어갑니다. AI 추천은 누르기 전에는 아무것도 바꾸지 않고, 한 것은 되돌릴 수 있습니다.</p>
  <nav class="tabs" id="tabs"></nav>
  <div id="list"></div>
</div>
<script>
  const L = [
    ['rc', '캘린더 화면의 오른쪽 패널', '가운데가 시간표라 시간표는 넣지 않았습니다.', [['1 섹션 쌓기', 'd-calendar.html?rp=1'], ['2 탭', 'd-calendar.html?rp=2'], ['3 손볼 할 일 한 목록', 'd-calendar.html?rp=3'], ['4 숫자 칸 + 펼치기', 'd-calendar.html?rp=4'], ['5 AI 브리핑 먼저', 'd-calendar.html?rp=5']], 'rc'],
    ['rt', '할 일 화면의 오른쪽 패널', '가운데가 목록이라 그날 시간표가 같이 들어갑니다.', [['1 섹션 쌓기', 'd-todos.html?rp=1'], ['2 탭', 'd-todos.html?rp=2'], ['3 손볼 할 일 한 목록', 'd-todos.html?rp=3'], ['4 숫자 칸 + 펼치기', 'd-todos.html?rp=4'], ['5 AI 브리핑 먼저', 'd-todos.html?rp=5']], 'rt'],
    ['rc2', '캘린더 화면: 요소마다 탭 하나 (6~10)', '하루, 시간 미정, 마감, 커밋, AI 추천을 각각 한 탭으로 나눴습니다. 화살표 키로 옆 탭으로 옮겨 갑니다.', [['6 위쪽 글자 탭 (기본)', 'd-calendar.html?rp=6'], ['7 오른쪽 아이콘 줄', 'd-calendar.html?rp=7'], ['8 아래쪽 탭 막대', 'd-calendar.html?rp=8'], ['9 요약 붙은 탭 목록', 'd-calendar.html?rp=9'], ['10 보기 고르기 + 숫자 키', 'd-calendar.html?rp=10']], 'rc2'],
    ['rt2', '할 일 화면: 요소마다 탭 하나 (6~10)', '시간표 탭이 하나 더 있고, 처음에는 시간표 탭이 열립니다.', [['6 위쪽 글자 탭 (기본)', 'd-todos.html?rp=6'], ['7 오른쪽 아이콘 줄', 'd-todos.html?rp=7'], ['8 아래쪽 탭 막대', 'd-todos.html?rp=8'], ['9 요약 붙은 탭 목록', 'd-todos.html?rp=9'], ['10 보기 고르기 + 숫자 키', 'd-todos.html?rp=10']], 'rt2'],
    ['ra', 'AI 작업 추천 다섯 모양 (캘린더)', '추천 내용은 같고 보여 주는 방법만 다릅니다. 누르기 전에는 아무것도 바뀌지 않고, 한 것은 되돌릴 수 있습니다. 6번 위쪽 글자 탭의 AI 추천 탭을 연 상태입니다.', [['1 바뀌는 모습 먼저', 'd-calendar.html?rp=6&rtab=ai&ra=1'], ['2 한 줄 목록 + 키보드', 'd-calendar.html?rp=6&rtab=ai&ra=2'], ['3 하루 계획 고친 안', 'd-calendar.html?rp=6&rtab=ai&ra=3'], ['4 하나씩 묻기', 'd-calendar.html?rp=6&rtab=ai&ra=4'], ['5 이유별 묶음', 'd-calendar.html?rp=6&rtab=ai&ra=5']], 'ra'],
    ['rb', 'AI 추천을 눈에 띄게 (6~10)', '문장 속에 묻혀 있던 할 일 이름과 바뀌는 값을 가장 크게 올렸습니다. 8번은 AI 탭을 안 열어도 어느 탭에서나 맨 위에 보이도록 하루 탭으로 열었습니다.', [['6 밝은 카드 한 장', 'd-calendar.html?rp=6&rtab=ai&ra=6'], ['7 캘린더 위에 자리 표시', 'd-calendar.html?rp=6&rtab=ai&ra=7'], ['8 어느 탭에서나 맨 위', 'd-calendar.html?rp=6&ra=8'], ['9 시각을 크게, 안내판', 'd-calendar.html?rp=6&rtab=ai&ra=9'], ['10 종류별 색면', 'd-calendar.html?rp=6&rtab=ai&ra=10']], 'rb'],
    ['rd', '7번 파생: 캘린더 위 자리 표시 (11~15)', '추천이 시간표 칸에 빗금으로 나오는 7번을 다듬었습니다. 칸의 왼쪽 띠는 종류 색이고, 패널 줄은 빗금을 줄여 글자를 먼저 읽게 했습니다. 11번을 기본으로 정했습니다.', [['11 칸을 누르면 펼침 (기본)', 'd-calendar.html?rp=6&rtab=ai&ra=11'], ['12 어디서 오는지 선으로', 'd-calendar.html?rp=6&rtab=ai&ra=12'], ['13 다른 일정 흐리게, 검토', 'd-calendar.html?rp=6&rtab=ai&ra=13'], ['14 끌어서 시간 고치기', 'd-calendar.html?rp=6&rtab=ai&ra=14'], ['15 패널도 시간순', 'd-calendar.html?rp=6&rtab=ai&ra=15']], 'rd'],
  ];
  const $ = (q) => document.querySelector(q);
  $('#tabs').innerHTML = L.map(([k, t]) => `<a href="#v${k}">${t.split(' (')[0].split(':')[0]}</a>`).join('');
  $('#list').innerHTML = L.map(([k, t, d, st, pv]) => `<section id="v${k}"><div class="hd"><h2>${t}</h2><p>${d}</p></div>
    <div class="st" role="group" aria-label="${t}">${st.length > 1 ? st.map(([l, u], i) => `<button type="button" data-k="${k}" data-u="${u}" aria-pressed="${i === 0}">${l}</button>`).join('') : ''}${k === 'um' ? '' : `<a id="a${k}" href="${st[0][1].replace(/&open=[^#]*/, '')}" target="_blank" rel="noopener">이걸로 보기</a>`}</div>
    <iframe id="f${k}" title="${t}" loading="lazy" src="${st[0][1]}"></iframe></section>`).join('');
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.st button'); if (!b) return;
    b.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    const f = $('#f' + b.dataset.k), u = b.dataset.u, a = $('#a' + b.dataset.k); if (a) a.href = u.replace(/&open=[^#]*/, '');
    f.src = 'about:blank'; setTimeout(() => { f.src = u; }, 30);
  });
  /* 키보드로 시안 안으로 들어가면 바깥 테두리로 표시 */
  const mark = () => document.querySelectorAll('iframe').forEach((f) => f.classList.toggle('kf', document.activeElement === f));
  window.addEventListener('blur', () => setTimeout(mark, 0)); window.addEventListener('focus', mark);
</script>
</body>
</html>
