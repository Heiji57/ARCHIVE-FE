<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHIVE 캘린더 시안 1 Wayfind</title>
<meta name="description" content="ARCHIVE 앱 셸과 캘린더 재디자인 시안. 오늘 할 일을 시각순 안내판으로 세운 Wayfind 방향.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500;800&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="../shared/archive-proto.js" defer></script>
</head>
<body>
<div class="app" data-archive data-default-view="month" data-panel="drawer" data-month-max="3">
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="./">A.R.C.H.I.V.E</a>
      <nav class="nav-links" aria-label="주 메뉴">
        <a href="#dashboard">대시보드</a>
        <a href="./" aria-current="page">캘린더</a>
        <a href="#todos">할 일</a>
        <a href="#retrospectives">회고</a>
        <a href="#settings">설정</a>
      </nav>
      <div class="nav-tools">
        <p class="sync">GitHub 저장소 3개 연결</p>
        <div class="a-search">
          <label class="visually-hidden" for="q">할 일과 회고록 검색</label>
          <input id="q" class="search" data-a="search" type="search" placeholder="검색" title="검색 (Ctrl K)" autocomplete="off">
          <div class="a-pop pop" data-a="search-results" hidden></div>
        </div>
        <div class="a-search">
          <button type="button" class="icon-btn" data-pop="notif" aria-expanded="false" aria-controls="notif" aria-label="알림, 새 알림 2개">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="badge">2</span>
          </button>
          <div class="a-pop pop" id="notif" hidden>
            <p class="pop-head">새 알림 2개</p>
            <ul class="notif-list">
              <li><strong>AI 요약 완료</strong><span>10월 월간 회고 요약이 준비됐습니다.</span></li>
              <li><strong>할 일 추가됨</strong><span>캘린더 드래그 버그 수정</span></li>
            </ul>
          </div>
        </div>
        <span class="user" title="developer@archive.dev"><span class="avatar" aria-hidden="true">D</span>developer</span>
        <button type="button" class="icon-btn" aria-label="로그아웃">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="banner-slot" data-a="banner" hidden></div>

    <aside class="today" aria-labelledby="today-h">
      <div class="today-head">
        <h2 id="today-h">오늘</h2>
        <p class="today-date">11월 2일 월요일</p>
        <p class="clock"><time datetime="14:20">14:20</time></p>
      </div>
      <div data-a="board"></div>
    </aside>

    <section class="a-stage" aria-label="캘린더">
      <div class="toolbar">
        <h1 class="title" data-a="title">11월</h1>
        <div class="stepper" role="group" aria-label="기간 이동">
          <button type="button" class="cell" data-nav="prev" aria-label="이전">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button type="button" class="cell" data-nav="today">오늘로</button>
          <button type="button" class="cell" data-nav="next" aria-label="다음">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <div class="views" role="group" aria-label="보기">
          <button type="button" class="cell" data-view="month">월간</button>
          <button type="button" class="cell" data-view="week">주간</button>
          <button type="button" class="cell" data-view="day">일간</button>
        </div>
        <dl class="a-counts counts" data-a="counts" aria-label="이 기간의 상태별 개수"></dl>
        <button type="button" class="cell expand" data-expand aria-label="캘린더 확대"></button>
      </div>
      <p class="visually-hidden" data-a="live" role="status"></p>
      <div class="cal" data-a="calendar"></div>
    </section>
  </main>

  <div class="a-scrim" data-scrim></div>
  <aside class="a-panel panel" data-a="panel" aria-label="작업 상세"></aside>
</div>
<noscript><p class="noscript">이 시안은 자바스크립트로 캘린더를 그립니다. 브라우저에서 스크립트를 켜 주세요.</p></noscript>
</body>
</html>
